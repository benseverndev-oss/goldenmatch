# Cross-language API parity manifest for goldenflow (MCP tools + CLI commands).
# See docs/superpowers/specs/2026-07-04-api-parity-gate-design.md.
# GENERATED by `check_api_parity.py goldenflow --init`, human-reviewed (2026-07-05). The CI
# api_parity gate fails if the real Python/TS surface stops matching this partition; every
# tool/command add/remove/rename must be reflected here in the same PR.
# Review: MCP tools at FULL parity (all shared). CLI: Python ships the richer surface
#   (serve/agent-serve/mcp-serve + init/interactive/schedule/watch); TS is a lean subset.
#   No naming divergence.
# a2a_skills: FULL A2A parity — Python and TS expose the same 6 AgentCard skill ids
#   (configure, diff-results, discover, handoff, map-schemas, transform-data). The hyphenated
#   ids match on both sides (no PY-hyphen / TS-underscore divergence). No divergence.
package: goldenflow
mcp_tools:
  shared:
  - diff
  - explain_transform
  - learn
  - list_domains
  - list_transforms
  - map
  - profile
  - select_from_findings
  - transform
  - validate
  python_only: []
  ts_only: []
cli_commands:
  shared:
  - agent-serve
  - demo
  - diff
  - history
  - learn
  - map
  - mcp-serve
  - profile
  - serve
  - stream
  - transform
  - validate
  python_only:
  - init
  - interactive
  - schedule
  - watch
  ts_only: []
a2a_skills:
  shared:
  - configure
  - diff-results
  - discover
  - handoff
  - map-schemas
  - transform-data
  python_only: []
  ts_only: []
# The transform vocabulary (each transform's registered name). Emitted from
# goldenflow.transforms.list_transforms (Python, all submodules registered via
# `import goldenflow`) <-> core/transforms/registry.ts listTransforms() (TS). This
# is the cross-language `transforms` parity surface -- the goldenflow analogue of
# goldenmatch's transforms surface (a partition, no kernel floor; goldenflow-core
# kernel-backing is separately guarded by the native_symbols `literal` idiom gate).
