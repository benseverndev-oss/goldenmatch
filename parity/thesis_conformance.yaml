  - id: three-golden-record-implementations
    status: resolved   # single-sourced through core.golden (_survivor_value -> merge_field /
                       # most_complete_value); config-aware done; ONE owner, tested green.
    tenet: T1
    severity: low   # was medium + declared:false (the dangerous class); RESOLVED --
                    # single authoritative owner, only doc-follow-on (identity golden
                    # is most_complete-only, not yet config-aware) remains
    declared: true
    title: "Golden-record rollup single-sourced through core.golden (was a 2nd hand-rolled rule in resolve.py)"
    detail: >-
      RESOLVED. The audit found resolve.py's ``_golden_record_from_members`` /
      ``_from_payloads`` hand-rolling a "longest non-null string" rollup that
      DUPLICATED core.golden's ``most_complete`` strategy (survivorship.py was never a
      third rule -- it already delegates to ``merge_field``). Both resolve helpers now
      call the single authoritative ``core.golden.most_complete_value`` (byte-identical
      to the retired inline loop -- ties by input order, all-null columns omitted --
      locked by tests/identity/test_golden_record_single_source.py), so the rollup rule
      cannot drift from the config-driven pipeline path or the provenance layer. ONE
      owner (core.golden) for the capability.
      CONFIG-AWARE DONE 2026-07-27: the identity golden path is no longer most_complete-ONLY.
      A `field_strategies` (col -> GoldenFieldRule) survivorship config threads through the
      seam (ResolutionBatch v2 field -> resolve_clusters/apply_batch -> the golden helpers),
      and `_survivor_value` dispatches each column through core.golden.merge_field with the
      configured strategy (else most_complete) -- so the identity golden record honors
      per-field survivorship config exactly like the config-driven builders, still ONE owner
      (core.golden), no second rule. Additive: no config => most_complete, byte-identical
      (locked by test_golden_record_single_source.py's config-override test + the retired-rule
      parity cases; 311 identity tests green). Strategies needing per-member sources/dates
      (source_priority / most_recent) degrade via merge_field's fallback -- the rollup does
      not thread those inputs (documented on `_survivor_value`).
    evidence:
      - packages/python/goldenmatch/goldenmatch/core/golden.py
      - packages/python/goldenmatch/goldenmatch/identity/resolve.py   # _survivor_value + field_strategies threading
      - packages/python/goldenmatch/goldenmatch/identity/resolution_batch.py   # v2 field_strategies contract term
      - packages/python/goldenmatch/tests/identity/test_golden_record_single_source.py
      - packages/python/goldenmatch/tests/identity/test_golden_record_single_source.py

  - id: standalone-ts-algorithms-no-shared-kernel
    tenet: T1
    severity: low   # was medium; RESOLVED -- Family A shares a kernel (cluster-wasm),
                    # Family B (goldenanalysis frame kernels) NOW shares one too
                    # (analysis-wasm intern reroute; Wave 1b un-deferred via #1788)
    declared: true   # declared in TS CLAUDE.md / wave1b spec + parity manifests
    default_routed: opt-in   # conformance v2: both kernels are SHARED but reached via opt-in
                             # enable (cluster-wasm / enableAnalysisWasm), pure-TS is the default
                             # fallback -- an intentional edge-bundle choice, not a latent gap
    title: "Clustering + goldenanalysis frame kernels: both families now share a kernel (cluster-wasm + analysis-wasm)"
    detail: >-
      TWO families, both resolved. (A) TS clustering: connected-components was already shared
      to WASM (graph-wasm); the MST oversized-split + confidence half is NOW shared too.
      RESOLVED across three slices: the kernels were extracted from the pyo3-only native crate
      into a pyo3-free `cluster-core` (A1), given a wasm-bindgen `cluster-wasm` surface, and TS
      `splitOversizedCluster`/`computeClusterConfidence` reroute to it behind the opt-in
      `cluster-wasm` backend registry (A2) -- exactly the graph-wasm pattern; pure-TS stays the
      byte-identical default fallback, and the split partition is deterministic so wasm ==
      pure-TS components exactly (parity-tested + the Python cluster-handoff oracle). So the
      MST-split kernel is one source of truth across Python-native + TS, not two impls.
      (B) goldenanalysis frame kernels (distinct_count/duplicate_row_ratio) NOW SHARE a kernel
      too (Wave 1b un-deferred 2026-07-27). The deferral rested on the interning being
      Arrow-specific; #1788 had already moved it OUT of Arrow into analysis-core's plain-buffer
      `intern_f64`/`intern_str` (canon_f64_bits NaN/-0.0 fold), so the SAME canon crosses to WASM
      with no arrow-rs bloat. analysis-wasm now exports intern_f64/intern_str +
      distinct_count_ids/duplicate_row_ratio_ids; TS `nUnique`/`duplicateRowRatio` route
      homogeneously-typed number/string columns through that shared kernel (opt-in
      enableAnalysisWasm; pure-TS is the classified fallback for bool/mixed columns, which JS's
      untyped per-cell model can't express as one typed buffer). null_ratio stays pure-TS (pure
      null-counting, no interning canon to share). Declared at the surface as `frame_kernels` in
      parity/goldenanalysis.yaml; the kernel path reproduces the Python-locked
      frame_kernels_adversarial.json EXACTLY (wasm-frame-kernels.parity.test.ts) alongside the
      pure-TS lock. So both families are one source of truth, not two impls.
    evidence:
      - packages/rust/extensions/cluster-core/src/lib.rs
      - packages/rust/extensions/cluster-wasm/src/lib.rs
      - packages/typescript/goldenmatch/src/core/cluster.ts
      - packages/typescript/goldenmatch/tests/parity/cluster-wasm.parity.test.ts
      - packages/rust/extensions/analysis-wasm/src/lib.rs   # frame-kernel wasm exports
      - packages/typescript/goldenanalysis/src/core/aggregate.ts   # nUnique/duplicateRowRatio reroute
      - packages/typescript/goldenanalysis/tests/parity/wasm-frame-kernels.parity.test.ts   # kernel == fixture
      - parity/goldenanalysis.yaml
      - docs/superpowers/specs/2026-07-06-goldenanalysis-wave1b-deferred.md

