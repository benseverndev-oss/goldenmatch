  - id: undeclared-cross-surface-divergences
    tenet: T2
    severity: low   # was high (undeclared); DECLARED now in 0046 amendment + docs-site
    declared: true   # Wave A (2026-07-26)
    title: "Cross-surface scorer/package divergences are now declared in the 0046 verdict table"
    detail: >-
      Divergences that differ across surfaces but are not in the cross-language verdict
      table (some buried in package CLAUDE.md, so under-declared rather than fully
      undeclared): (a) array_intersect:overlap MODE pure-TS-only (fixed-id score_matrix
      can't carry the mode; the base scorer is kernel-backed); (b) PPRL float-field CLK
      byte-divergence str(5.0)="5.0" vs String(5.0)="5"; (c) radial + ensemble scorers
      ~4dp even under WASM (reduction/recomposition order), contradicting the table's
      "byte-identical with WASM" claim; (d) goldenanalysis frame-kernel parity outside
      0046 scope entirely.
      CLOSED 2026-07-27: the 0046 amendment now enumerates the scorer/package-level
      divergences, not just distributed/VLM/routing -- (c) radial/ensemble ~4dp under
      WASM, (b) PPRL float-field CLK, and (a) array_intersect `overlap` MODE pure-TS-only
      are all named there; (d) the goldenanalysis frame-kernel is a goldenanalysis
      boundary and is now SHARED (see standalone-ts-algorithms / analysis-wasm reroute),
      not just fixture-locked. The amendment's prior FS bullet ("default TS FS is pure-TS,
      not the shared kernel") was itself corrected in the same pass -- FS now runs the
      shared kernel by default on the batteries entry (see fs-default-ts-path).
      (Note: numeric_diff was Python-only when this audit began; it is now kernel-backed
      on main -- an example of the live harvest catching curated drift.)
    evidence:
      - packages/typescript/goldenmatch/CLAUDE.md
      - packages/typescript/goldenmatch/src/core/wasm/backend.ts
      - docs/superpowers/specs/2026-07-06-goldenanalysis-wave1b-deferred.md

  - id: three-golden-record-implementations
    tenet: T1
    severity: low   # was medium + declared:false (the dangerous class); RESOLVED --
                    # single authoritative owner, only doc-follow-on (identity golden
                    # is most_complete-only, not yet config-aware) remains
    declared: true
    title: "Golden-record rollup single-sourced through core.golden (was a 2nd hand-rolled rule in resolve.py)"
    detail: >-
      RESOLVED. The audit found resolve.py's ``_golden_record_from_members`` /
      ``_from_payloads`` hand-rolling a "longest non-null string" rollup that
      DUPLICATED core.golden's ``most_complete`` strategy (survivorship.py was never a
      third rule -- it already delegates to ``merge_field``). Both resolve helpers now
      call the single authoritative ``core.golden.most_complete_value`` (byte-identical
      to the retired inline loop -- ties by input order, all-null columns omitted --
      locked by tests/identity/test_golden_record_single_source.py), so the rollup rule
      cannot drift from the config-driven pipeline path or the provenance layer. ONE
      owner (core.golden) for the capability. REMAINING (doc follow-on, not a divergence):
      the identity golden path is most_complete-ONLY (ignores field_strategies / config),
      unlike the config-driven builders -- a conscious scope, threading a survivorship
      config through resolve_clusters is a separate feature, not a second source of truth.
    evidence:
      - packages/python/goldenmatch/goldenmatch/core/golden.py
      - packages/python/goldenmatch/goldenmatch/identity/resolve.py
      - packages/python/goldenmatch/tests/identity/test_golden_record_single_source.py

  - id: standalone-ts-algorithms-no-shared-kernel
    tenet: T1
    severity: low   # was medium; RESOLVED -- Family A shares a kernel (cluster-wasm),
                    # Family B (goldenanalysis frame kernels) NOW shares one too
                    # (analysis-wasm intern reroute; Wave 1b un-deferred via #1788)
    declared: true   # declared in TS CLAUDE.md / wave1b spec + parity manifests
    default_routed: opt-in   # conformance v2: both kernels are SHARED but reached via opt-in
                             # enable (cluster-wasm / enableAnalysisWasm), pure-TS is the default
                             # fallback -- an intentional edge-bundle choice, not a latent gap
    title: "Clustering + goldenanalysis frame kernels: both families now share a kernel (cluster-wasm + analysis-wasm)"
    detail: >-
      TWO families, both resolved. (A) TS clustering: connected-components was already shared
      to WASM (graph-wasm); the MST oversized-split + confidence half is NOW shared too.
      RESOLVED across three slices: the kernels were extracted from the pyo3-only native crate
      into a pyo3-free `cluster-core` (A1), given a wasm-bindgen `cluster-wasm` surface, and TS
      `splitOversizedCluster`/`computeClusterConfidence` reroute to it behind the opt-in
      `cluster-wasm` backend registry (A2) -- exactly the graph-wasm pattern; pure-TS stays the
      byte-identical default fallback, and the split partition is deterministic so wasm ==
      pure-TS components exactly (parity-tested + the Python cluster-handoff oracle). So the
      MST-split kernel is one source of truth across Python-native + TS, not two impls.
      (B) goldenanalysis frame kernels (distinct_count/duplicate_row_ratio) NOW SHARE a kernel
      too (Wave 1b un-deferred 2026-07-27). The deferral rested on the interning being
      Arrow-specific; #1788 had already moved it OUT of Arrow into analysis-core's plain-buffer
      `intern_f64`/`intern_str` (canon_f64_bits NaN/-0.0 fold), so the SAME canon crosses to WASM
      with no arrow-rs bloat. analysis-wasm now exports intern_f64/intern_str +
      distinct_count_ids/duplicate_row_ratio_ids; TS `nUnique`/`duplicateRowRatio` route
      homogeneously-typed number/string columns through that shared kernel (opt-in
      enableAnalysisWasm; pure-TS is the classified fallback for bool/mixed columns, which JS's
      untyped per-cell model can't express as one typed buffer). null_ratio stays pure-TS (pure
      null-counting, no interning canon to share). Declared at the surface as `frame_kernels` in
      parity/goldenanalysis.yaml; the kernel path reproduces the Python-locked
      frame_kernels_adversarial.json EXACTLY (wasm-frame-kernels.parity.test.ts) alongside the
      pure-TS lock. So both families are one source of truth, not two impls.
    evidence:
      - packages/rust/extensions/cluster-core/src/lib.rs
      - packages/rust/extensions/cluster-wasm/src/lib.rs
      - packages/typescript/goldenmatch/src/core/cluster.ts
      - packages/typescript/goldenmatch/tests/parity/cluster-wasm.parity.test.ts
      - packages/rust/extensions/analysis-wasm/src/lib.rs   # frame-kernel wasm exports
      - packages/typescript/goldenanalysis/src/core/aggregate.ts   # nUnique/duplicateRowRatio reroute
      - packages/typescript/goldenanalysis/tests/parity/wasm-frame-kernels.parity.test.ts   # kernel == fixture
      - parity/goldenanalysis.yaml
      - docs/superpowers/specs/2026-07-06-goldenanalysis-wave1b-deferred.md

  - id: a2a-skills-bidirectional-fracture
    tenet: T1
    severity: low   # was medium; the one genuine surface INCONSISTENCY (the MDM
                    # trio, shared on MCP but ts_only on A2A) is now reconciled;
                    # the remaining two-sided gap is ALL verified-intentional
                    # divergence, not a conform gap
    declared: true   # gate-enforced partition
    title: "goldenmatch a2a_skills two-sided gap is now all intentional divergence (MDM trio reconciled)"
    detail: >-
      Was the widest single-surface gap (14 python_only vs 13 ts_only). RECONCILED
      2026-07-26: the one case that was a genuine "shared capability that doesn't conform"
      (commitment 3) -- the #1114 MDM read-side trio identity_profile / identity_stats /
      identity_worklist, which is SHARED on the MCP surface but was ts_only on the A2A card
      -- is fixed by advertising it on Python's A2A card too (the capability already existed
      via entity_profile/identity_summary_stats/steward_worklist + the MCP tools). Gap is now
      14 python_only vs 10 ts_only, and every remaining divergence is VERIFIED-DIFFERENT, NOT
      drift: PY's richer file-lifecycle/routing skills (configure/list_runs/rollback/review/
      incremental/sensitivity/schema_match/compare_clusters/analyze_blocking/retrieve_similar/
      documents_*) which the edge-safe TS surface intentionally omits; PY `quality` vs TS
      `scan_quality`+`fix_quality` (1:2 granularity); PY `pprl` RUNS linkage vs TS `suggest_pprl`
      SUGGESTS params; and TS's edge agent_* variants + score/memory_import primitives. Two
      surfaces exposing genuinely different capabilities is what commitment 3 ALLOWS -- the
      conform requirement applied to the one shared-but-unadvertised case, now closed.
    evidence:
      - parity/goldenmatch.yaml
      - packages/python/goldenmatch/goldenmatch/a2a/server.py   # identity_profile/stats/worklist skill defs
      - packages/python/goldenmatch/goldenmatch/a2a/skills.py   # trio delegates to mcp.identity_tools._dispatch

  - id: frame-residency-coupling-not-contractual
    tenet: T4
    severity: low
    declared: true
    title: "Compute/control shared frame-residency budget: now a contract field (was env-only)"
    detail: >-
      Control-plane write memory stacks on the compute prep floor (emit_singletons
      materializes every referenced row; ~35 GB on a 14M frame), bounded by flushing
      every flush_rows records. ADDRESSED-IN-PART (Wave C / C1): flush_rows is now a
      field on ResolutionBatch (a contract term), and emit_singletons rides the same
      contract, instead of the budget living only in inline comments + the
      GOLDENMATCH_IDENTITY_BULK_FLUSH_ROWS env var. REMAINING: the prep-floor half of
      the budget (the compute side) is still implicit; the full shared-budget accounting
      lands with the C1 data-array fold.
    evidence:
      - packages/python/goldenmatch/goldenmatch/identity/resolve.py:71
      - packages/python/goldenmatch/goldenmatch/identity/resolve.py:453

  - id: deferrals-lack-measurement-provenance
    tenet: T3
    severity: low
    declared: true
    un_defer: >-
      RE-VALIDATE (conformance v2, 0047 amendment): re-fires the moment a scorer/blocking
      deferral is added whose reason is PERF/SHAPE rather than model-backed -- that entry then
      owes a MEASURED wall-clock (kernelize on measurement). Currently vacuous: every deferral
      (embedding / record_embedding / simhash) is model-backed. Re-check on any new
      scorer_kernels_deferred / blocking_kernels_deferred entry.
    title: "Kernel deferrals state a reason but not measured wall-clock provenance"
    detail: >-
      scorer_kernels_deferred / blocking_kernels_deferred entries carry a prose reason
      (deferred/declined/n-a) but no measured evidence (the frame's tenet is 'kernelize
      on measurement'). The deferral rationale should cite a measurement WHEN THE REASON
      IS PERF/SHAPE rather than model-backed.
      REASSESSED 2026-07-27: the trigger is currently vacuous -- EVERY remaining deferral
      is MODEL-BACKED, not perf/shape, so none needs a wall-clock citation. Scorers: 24
      total, 22 kernel-backed, only `embedding` + `record_embedding` deferred ("n/a --
      model-backed"; numeric_diff + cosine were kernelized 2026-07-25/26). Blocking:
      `simhash` alone ("declined -- model-backed": needs a bundled edge model TS doesn't
      ship). A model-backed scorer/blocker is NOT a kernel-perf decision, so "kernelize on
      measurement" doesn't apply to it. The invariant stands as a tripwire for any FUTURE
      perf/shape deferral -- which would then owe a measured wall-clock -- but there is
      nothing to measure in the current set.
    evidence:
      - parity/goldenmatch.yaml
