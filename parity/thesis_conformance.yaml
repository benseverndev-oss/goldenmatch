# Thesis-conformance weakness inventory
#
# Scores the codebase against the governing architecture frame
# (context-network/architecture/one-product-two-engines.md, decision 0047):
# "one product, two engines, many surfaces."
#
# This is the CURATED half of the audit. The LIVE half (surface-gap counts,
# _FALLBACK_ONLY kernels, deferred scorers) is harvested directly from
# parity/*.yaml and the per-package _native_loader.py by
# scripts/check_thesis_conformance.py, so drift shows up without editing this file.
#
# Each weakness maps to one of the five decision tests. `declared: false` marks the
# DANGEROUS class -- a real cross-surface/architectural divergence with no
# conformance level or contract covering it. Keep this file in sync when a
# weakness is closed or a new one is found; the script's --check mode fails when a
# live signal (a new _FALLBACK_ONLY kernel, an uncovered scorer, a declared-divergent
# boundary with no parity test) has no matching inventory entry.
#
# `status: resolved` ARCHIVES an entry off the LIVE risk board (conformance v2, 0047
# amendment process #4: "retire resolved-and-stable / vacuous items so the live list
# is the actual risk surface, not a museum of closed wins"). The entry + its evidence
# stay for the record; build_scorecard splits open (no status) from resolved, and the
# gate only checks the open ones. Un-archive by removing the marker if a premise rots.

# Housekeeping (conformance v2, 0047 amendment #5):
# - T5 (Arrow-at-bulk-boundaries) is DECLARED WON: it has never recorded a weakness, and
#   the smallest-stable-primitive discipline is enforced live (several kernels take plain
#   list[str]/two-string args, not Arrow). A future Arrow-forced-into-a-scalar-call
#   regression re-opens it -- until then it is a solved tenet, not a silent measurement gap.
# - INTENTIONAL ASYMMETRY is a first-class principle, not a weakness: the edge-safe TS
#   subset deliberately omits heavy Python surfaces (distributed / Ray / GPU / full
#   REST+web UI, opt-in-default WASM for bundle size). Those surface gaps are
#   declared-by-design and are NOT re-litigated each audit.
tenets:
  T1: "One authoritative semantic owner per capability (no second source of truth)."
  T2: "Conformance defines correctness (every divergence has a declared level + a test)."
  T3: "Kernelize on measurement (deferrals classified; no silent regress to fallback)."
  T4: "Compute vs control stay architecturally distinct (explicit, versioned seam)."
  T5: "Arrow at bulk boundaries, not the universal calling convention. [DECLARED WON -- see header]"

# Default-routing inventory (conformance v2, 0047 amendment -- T1). The refined T1
# test is "one owner AND the DEFAULT caller path routes to it": a shared owner shipped
# opt-in while a second impl is the default is a LATENT second source (the fs-default
# class). `check_thesis_conformance.py::harvest_ts_default_routing` VERIFIES these
# claims against the code -- for a TS batteries entry it reads which enable-* kernels
# are auto-registered as an import-time side-effect (a bare top-level call, resolving
# `import { X as Y }` aliases) -- so a regressed default can't sit behind a stale
# annotation. `owner_default` symbols MUST be auto-registered (else a GATING failure);
# `opt_in` kernels must NOT be (deliberate edge-bundle discipline; auto-registering one
# is an advisory reclassify prompt). A new auto-registered kernel absent from the
# inventory is an advisory "add it so its default is audited".
default_routing:
  ts_batteries:
    entry: packages/typescript/goldenmatch/src/index.ts
    # T2 (conformance v2 follow-on): the static T1 gate proves the owner is
    # AUTO-REGISTERED here; this vitest gate proves a default workload actually
    # ROUTES THROUGH it (the honest limit T1 documented). Existence is guarded in
    # scripts/test_thesis_conformance.py so the runtime check can't be silently
    # dropped while this inventory still claims the default is code-verified.
    runtime_reached_test: packages/typescript/goldenmatch/tests/unit/fs-default-routing-reached.test.ts
    owner_default:
      - enableFsWasmScoring   # fs_core default-on: registerFsKernel() at import (was the fs-default gap)
    opt_in:                   # edge-bundle discipline: reachable only via an explicit enable*() call
      - enableAutoconfigWasm
      - enableClusterWasm
      - enableFingerprintWasm
      - enableGraphWasm
      - enablePerceptualWasm
      - enableSketchWasm
      - enableSuggestWasm

# Severity: critical > high > medium > low
weaknesses:
  - id: incremental-resolution-no-persisted-index
    status: resolved   # C2 index + C4 bounded-work + no-PK content-hash landed & tested;
                       # only residual is an OPTIONAL large-corpus RSS bench -> that is a
                       # measurement-frontier item (needs scale infra), not a correctness gap.
    tenet: T4
    severity: low   # RESOLVED: C2 (persisted index + bidirectional query) + C4
                    # (bounded-work scale proof) landed; only broader-corpus RSS
                    # benchmarking beyond the CI-stable proof remains
    declared: true   # named as OPEN 9.1 in the frame
    title: "Incremental resolution against a persisted identity index (C2/C4 landed)"
    detail: >-
      RESOLVED (manifesto §4(ii), owner-decided (ii) control-plane-owned index 2026-07-26).
      The incremental path now scores a NEW record against its block-mates gathered from a
      PERSISTED store index -- no full-corpus in-RAM re-block. Landed across four slices:
      SLICE 1 -- the persisted `identity_record_block_keys` store index (SQLite + Postgres +
      Alembic 0005, schema v6) + `index_record_block_keys`/`candidates_by_block_keys`
      write/query API. SLICE 2 -- `identity/block_index.py`: the stateless block-key compute
      (`compute_record_block_keys`/`compute_frame_block_keys`, reusing the pipeline's own
      `_build_block_key_expr`) + `backfill_block_index` population. SLICE 3 -- `_resolve_via_index`
      wires the bidirectional seam into `resolve_record_incremental` (compute keys -> query the
      index -> gather ONLY block-mate payloads -> resolve -> self-populate the index); the
      full-`df` path stays byte-identical when `blocking` is None. SLICE 3b -- `_exact_match_rows`
      closes the exact-matchkey gap (`match_one` returned `[]` for exact matchkeys), so exact-only
      incremental resolve works, and it flows to every caller (index path, `match_record_to_entity`,
      StreamProcessor). C4 -- a CI-stable bounded-work proof: the candidate gather is EXACTLY the
      block-mates and the resolve's store-read work is INVARIANT in corpus size M (test at M=100 vs
      M=1000), plus a tracemalloc ceiling -- the measured kill criterion in deterministic form.
      NO-PK IDS DONE 2026-07-27: the index-backed path was documented PK-only (its all-string
      candidate frame is dtype-safe for PK ids); it in fact also resolves no-PK CONTENT-HASH
      records to the same entity as the full-df path (the fingerprint the hash covers is
      string-canonical, so stringifying the candidate payload doesn't shift its id). Proven +
      parity-locked (test_index_path_no_pk_content_hash_absorbs_like_full_df); docstrings
      relaxed. Numeric fields inherit the general str() canonicalization note.
      REMAINING (non-blocking, optional): a large-corpus RSS benchmark beyond the CI bounded-work
      proof -- a measurement nice-to-have, not a correctness gap.
    evidence:
      - packages/python/goldenmatch/goldenmatch/identity/store.py   # identity_record_block_keys + index API
      - packages/python/goldenmatch/goldenmatch/identity/block_index.py   # stateless compute + backfill
      - packages/python/goldenmatch/goldenmatch/identity/resolve.py   # _resolve_via_index + _exact_match_rows
      - packages/python/goldenmatch/tests/identity/test_incremental_index.py   # index==full-df parity
      - packages/python/goldenmatch/tests/identity/test_incremental_exact.py   # exact-matchkey path
      - packages/python/goldenmatch/tests/identity/test_incremental_scale.py   # C4 bounded-work proof
    owner_next: "context-network/architecture/identity-control-plane-manifesto.md (§4 (ii) delivered; C2 + C4 + no-PK ids landed; optional: large-corpus RSS bench)"

