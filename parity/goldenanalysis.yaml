# Cross-language API parity manifest for goldenanalysis (MCP tools + CLI commands).
# See docs/superpowers/specs/2026-07-04-api-parity-gate-design.md.
# GENERATED by `check_api_parity.py goldenanalysis --init`, human-reviewed (2026-07-05). The CI
# api_parity gate fails if the real Python/TS surface stops matching this partition; every
# tool/command add/remove/rename must be reflected here in the same PR.
# Review: goldenanalysis-js now ships an MCP server (src/node/mcp/server.ts), wrapping the
#   engines the TS package already carries (registry.availableAnalyzers / analyze / render /
#   ReportHistory) — so all four MCP tools are SHARED, and the `mcp-serve` CLI command that
#   launches it is shared too. (.parquet input is Python-only on analyze_frame — the edge-safe
#   TS port ships no Parquet reader — but the tool itself exists on both surfaces.)
package: goldenanalysis
mcp_tools:
  shared:
  - analyze_frame
  - detect_regressions
  - get_trend
  - list_analyzers
  python_only: []
  ts_only: []
cli_commands:
  shared:
  - mcp-serve
  - regressions
  - report
  - trend
  python_only: []
  ts_only: []
# The discoverable analyzer registry (each analyzer's registered name). Emitted
# from goldenanalysis.registry.available_analyzers (Python) <-> core/registry.ts
# availableAnalyzers() (TS). This is the cross-language `analyzers` parity surface
# -- a partition (no kernel floor; the analysis-core kernel-backing of individual
# analyzers is guarded separately by native/wasm parity fixtures). All 4 analyzers
# are shared 1:1 across Python + TS.
analyzers:
  # key.integrity: metric-aware key-integrity certification (semantic-layer wedge,
  # ADR 0049) — reports a goldenmatch KeyIntegrityCertificate (unique-at-grain,
  # per-measure fan-out, opt-in undercount/fragmentation). It is a PURE PROJECTION
  # of the serialized certificate (no ER pipeline / kernel — the resolution tier that
  # produces the cert stays Python-only), so the deliberate-follow-on TS port
  # (core/analyzers/keyIntegrity.ts, mirroring match.rates) landed it as SHARED. All
  # 5 analyzers are now shared 1:1 across Python + TS.
  shared:
  - cluster.distribution
  - frame.summary
  - key.integrity
  - match.rates
  - quality.rollup
  python_only: []
  ts_only: []
# Frame-kernel cross-language boundary (distinct_count / null_ratio /
# duplicate_row_ratio). Same classification-map idiom as goldenmatch's
# blocking_kernels_deferred / scorer_kernels_deferred (skipped in check_structure;
# not a shared/python_only/ts_only partition). Wave 1b, UN-DEFERRED (2026-07-27):
# #1788 moved the semantically load-bearing interning OUT of Arrow into
# analysis-core's plain-buffer `intern_f64`/`intern_str` (canon_f64_bits: -0.0/0.0,
# NaN/NaN/null fold), so the SAME canon crosses to WASM with no arrow-rs bloat.
# analysis-wasm now exports intern_f64/intern_str + distinct_count_ids/
# duplicate_row_ratio_ids; the TS `nUnique`/`duplicateRowRatio` route homogeneously-
# typed number/string columns through that shared kernel (opt-in enableAnalysisWasm;
# pure-TS is the classified fallback for bool/mixed columns). Locked by the
# adversarial cross-surface fixture (frame_kernels_adversarial.json) run through
# BOTH the pure-TS path (frameKernels.parity.test.ts) and the kernel
# (wasm-frame-kernels.parity.test.ts). See docs/superpowers/specs/
# 2026-07-06-goldenanalysis-wave1b-deferred.md (superseded).
frame_kernels:
  distinct_count: "shared -- analysis-wasm intern_f64/intern_str + distinct_count_ids (opt-in); pure-TS fallback for bool/mixed columns; locked by frame_kernels_adversarial.json"
  duplicate_row_ratio: "shared -- analysis-wasm intern_* + duplicate_row_ratio_ids (opt-in); pure-TS fallback for bool/mixed columns; locked by frame_kernels_adversarial.json"
  null_ratio: "pure-TS -- pure null-counting, no interning canon to share; TS<->Python locked by frame_kernels_adversarial.json"
