# Cross-language API parity manifest for infermap (MCP tools + CLI commands).
# See docs/superpowers/specs/2026-07-04-api-parity-gate-design.md.
# GENERATED by `check_api_parity.py infermap --init`, human-reviewed (2026-07-05). The CI
# api_parity gate fails if the real Python/TS surface stops matching this partition; every
# tool/command add/remove/rename must be reflected here in the same PR.
# Review: MCP tools at FULL parity. CLI: apply/inspect/map/mcp-serve/validate are all shared
#   (both surfaces expose the MCP server via `mcp-serve`). No naming divergence.
# Compute surfaces (added 2026-07-25): infermap is the second package after goldenmatch to
#   model its M:N scorer surface + infermap-core kernel coverage, so check_scorer_coverage
#   gates it too — every scorer is EITHER kernel-backed (score fed from one infermap-core
#   Rust kernel to Python-native + TS-WASM) OR declared in scorer_kernels_deferred with a
#   reason. exact/fuzzy_name/initialism/pattern_type/profile are shared kernels (Waves 1-4);
#   alias (data-lookup) is deferred and llm is model-backed (n/a).
package: infermap
mcp_tools:
  shared:
  - apply
  - inspect
  - layers
  - map
  - validate
  python_only: []
  ts_only: []
cli_commands:
  shared:
  - apply
  - inspect
  - layers
  - map
  - mcp-serve
  - validate
  python_only: []
  ts_only: []
# The M:N field scorers (each scorer class's `.name`). Emitted from
# infermap.scorers.SCORER_NAMES (Python) <-> core/scorers/registry.ts SCORER_NAMES
# (TS). Full parity: both surfaces ship the same 7 scorer identities.
scorers:
  shared:
  - AliasScorer
  - ExactScorer
  - FuzzyNameScorer
  - InitialismScorer
  - LLMScorer
  - PatternTypeScorer
  - ProfileScorer
  python_only: []
  ts_only: []
# The scorers backed by an infermap-core Rust kernel (the reference fast path):
# Python-native (infermap-native, via _native_loader._COMPONENT_SYMBOLS) AND
# TS-WASM (infermap-wasm, via core/wasm/backend.ts InfermapBackend) over ONE core,
# so Python-native == TS-WASM by construction. Emitted from
# infermap.scorers.SCORER_KERNELS <-> registry.ts SCORER_KERNELS.
scorer_kernels:
  shared:
  - ExactScorer
  - FuzzyNameScorer
  - InitialismScorer
  - PatternTypeScorer
  - ProfileScorer
  python_only: []
  ts_only: []
# COVERAGE FLOOR (check_scorer_coverage). Every scorer in `scorers` NOT in
# `scorer_kernels` MUST appear here with a reason -- the gate FAILS otherwise, so a
# new/regressed infermap scorer can't sit un-kernelized or un-declared (the same
# floor that gates goldenmatch). `deferred --` = will kernelize; `declined --` =
# won't (with why); `n/a --` = not a deterministic string kernel.
scorer_kernels_deferred:
  AliasScorer: "declined -- dictionary-lookup scorer: the whole computation is `name.strip().lower()` then an ALIASES-table lookup (runtime DATA) + a fixed 0.95/0.0 decision. The key-derivation is trivial `strip().lower()` -- kernelizing it would pay Arrow/FFI on a two-op string call for no gain (the 'Arrow at bulk boundaries, not trivial ops' decision test), and the lookup is data not logic (the goldenflow category_standardize precedent, which declines the lookup). No meaningful string kernel to single-source."
  LLMScorer: "n/a -- model/network-backed (LLM adjudication); not a deterministic string kernel, stays host like goldenmatch embedding/record_embedding."
