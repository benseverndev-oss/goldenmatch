name: Publish goldenmatch-kg to PyPI

# Thin caller -> .github/workflows/_publish-pypi.yml (the shared template).
# goldenmatch-kg is a pure-Python package (hatchling) that drops goldenmatch in
# as the ER stage of neo4j-graphrag / LlamaIndex / Graphiti. It is EXCLUDED from
# the uv workspace (its framework extras are heavy, conflicting dep trees), but
# `python -m build` runs from its own pyproject standalone, so the reusable
# template works unchanged. Its runtime dep (goldenmatch) resolves from PyPI.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag or commit to build (default: HEAD of main)"
        required: false
        default: ""
      dry_run:
        description: "Build + validate without publishing"
        required: false
        default: "false"

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    # Only run for goldenmatch-kg-v* tags. NOTE the goldenmatch publisher fires on
    # the BARE v* tag (not goldenmatch-v*), so goldenmatch-kg-v* never cross-triggers
    # it; the explicit prefix keeps it distinct from goldenmatch-kg-js-v* too.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'goldenmatch-kg-v')
    uses: ./.github/workflows/_publish-pypi.yml
    with:
      package: goldenmatch-kg
      ref: ${{ inputs.ref || '' }}
      dry_run: ${{ inputs.dry_run || 'false' }}
    secrets: inherit
