# Bench-ray-cluster: provision an ephemeral GCE Ray cluster, run the
# QIS bench against it, tear the cluster down. Workflow_dispatch only.
#
# Costs: ~$1 per 30-minute bench at the default 4-node n2-standard-16
# config (1 head + 3 preemptible workers). The tear-down step runs in
# `if: always()` so a failed bench still releases the instances.
#
# Required GitHub secret (provision once per repo):
#   DOPPLER_TOKEN — read-only Doppler service token scoped to
#                   project `showcase`, config `dev`. One secret, not
#                   two: the token carries its own project/config, so
#                   there is no login step and no scope flags.
#
# Pulled FROM Doppler showcase/dev at runtime:
#   GCP_RAY_BENCH_PROJECT_ID  — GCP project that holds the bench SA +
#                                APIs (golden-490919). NOT the same as
#                                GOOGLE_CLOUD_PROJECT, which the team
#                                uses for a different (Vertex) project.
#   GCP_SA_KEY_B64            — base64-encoded service account JSON
#                           (roles listed below). Decoded to disk at
#                           fetch time; never echoed.
#
# Required GCP service account roles:
#   - roles/compute.admin       (create/delete instances + disks)
#   - roles/iam.serviceAccountUser (let Ray attach the SA to instances)
#
# Pattern: any future Doppler-backed secret rides the same token
# instead of accumulating GH secrets. See
# docs/distributed/ray-gce-cluster.md for the one-time service-token
# setup command.

name: bench-ray-cluster

on:
  workflow_dispatch:
    inputs:
      rows:
        description: "Rung size (5000000 = 5M, 100000000 = 100M)"
        required: false
        default: "5000000"
      shape:
        description: "realistic | phase5"
        required: false
        default: "realistic"
      label:
        description: "Tag for the output artifact"
        required: false
        default: "ad-hoc"
      max_workers:
        description: "Number of worker nodes (head is always +1)"
        required: false
        default: "3"
      distributed:
        description: "1 = run the REAL Phase-5 distributed engine (PIPELINE=2, block-shuffle + randomized-contraction WCC) and oracle-score it; 0 = the in-memory backend=ray path (legacy; does NOT distribute)"
        required: false
        default: "0"
      wcc_scratch:
        description: "Shared gs:// scratch for the distributed WCC + assignments (required when distributed=1). Cluster nodes need storage access to this bucket."
        required: false
        default: "gs://gm-phase5-844-golden490919/qis-dist"
      partitions:
        description: "Ray Dataset partition count for the distributed run"
        required: false
        default: "64"
      # --- #957 distributed score-tuning knobs -------------------------
      # Leave EMPTY to keep the engine's own default. Pinning every knob to
      # its default would silently stop testing the default. The effective
      # values land in the artifact JSON under "score_knobs", so a run always
      # states the configuration that produced its number.
      # Only in force when distributed=1: these tune the block-shuffle score
      # stage, which the legacy backend=ray path never enters.
      score_num_cpus:
        description: "#957: CPUs reserved per distributed scoring task (empty = engine default 2)"
        required: false
        default: ""
      score_concurrency:
        description: "#957: explicit concurrency= on the _score map_batches (empty = let Ray decide)"
        required: false
        default: ""
      score_project:
        description: "#957: project to scoring columns before the block-shuffle. 1 = on, 0 = off, empty = engine default (on)"
        required: false
        default: ""
      op_reservation:
        description: "#957: Ray Data per-op object-store reservation ratio, e.g. 0.2. Lower it when _score is [backpressured:tasks(ResourceBudget)] below CPU capacity (empty = Ray default ~0.5)"
        required: false
        default: ""
      shuffle_parts:
        description: "#957: block-shuffle partition count (empty = the harness default 512)"
        required: false
        default: ""
      bucket_debug:
        description: "1 = per-bucket prep-vs-kernel-vs-postfilter timing from the scorer (GOLDENMATCH_BUCKET_DEBUG). Output-invariant; costs an env read and a perf_counter per bucket. Splits time between the Rust kernel and the frame prep around it (sort + group_by + to_arrow), which is what tells you whether a knob moved the kernel or the wrapping. Worth having on for a baseline run."
        required: false
        default: "0"
      pairs_cache:
        description: "gs:// path for the scored-pair set. First run with a given path WRITES it; later runs READ it and skip scoring (38-44 min of a ~50 min 100M run). Use it when the experiment is DOWNSTREAM of scoring -- clustering route, WCC algorithm. Nothing validates that cached pairs match the current config, so key the path per config, and note a cached run's dedupe wall is not comparable to a full one."
        required: false
        default: ""
      clustering_threshold:
        description: "Pair-count threshold above which clustering DISTRIBUTES. Empty = the harness default (2e9, i.e. never: clustering runs on the driver). 0 forces the distributed WCC. The driver path measured 707s at 100M -- 45% connected components, 35% pulling pairs across -- and the distributed alternative was rejected as a multi-hour tail before the current code existed, so that trade is due a re-measure."
        required: false
        default: ""
      cluster_debug:
        description: "1 = per-step timing for the DRIVER-SIDE clustering stage (GOLDENMATCH_CLUSTER_DEBUG): pull / derive-ids / index / connected-components / build-output. Output-invariant. That stage is ~25 min of a 100M run for ~70s of graph algorithm, and which step owns the rest has never been measured."
        required: false
        default: "0"
      ray_version:
        description: "Ray version for BOTH launcher and cluster image. Default 2.56.0 = goldenmatch's own declared [ray] floor, one minor above the 2.55.1 that produced the June baseline. Pinned so a sweep varies the knob and not Ray. Empty = float to latest."
        required: false
        default: "2.56.0"
      zone:
        description: "GCE zone. Capacity is per-zone and independent of quota -- on ZONE_RESOURCE_POOL_EXHAUSTED, or on `0/N workers` at Verify workers joined, re-dispatch in another zone rather than waiting. Default us-east1-b: every green run to date used it (33087786765, 33074452121, 33006980567, 32992647463), while us-central1-a returned 0/3 on-demand n2-standard-16 workers in run 33174606401 and .ray/cluster-gce.yaml already records its spot capacity as intermittent. n2-highmem-32/-64 and n2-standard-16 are also offered in us-central1-{a,b,c,f}."
        required: false
        default: "us-east1-b"
      head_machine:
        description: "Head node machine type (the driver generates the full frame in memory; highmem for distributed runs). 100M: n2-highmem-32 (256 GB); 200M: n2-highmem-64 (512 GB)."
        required: false
        default: "n2-highmem-32"

permissions:
  contents: read
  issues: write # the alert step files/updates the bench-infra failure issue
  actions: read # the alert step reads its own run's jobs to name the failed step

jobs:
  ray-cluster-bench:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      # We render `.ray/cluster-gce.yaml` from the placeholder template
      # at workflow runtime so each dispatch sees a fresh cluster name
      # (avoids collisions if two dispatches overlap) and the right
      # project_id + git SHA.
      CLUSTER_NAME: "goldenmatch-bench-${{ github.run_id }}"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"

      - name: Install Ray + gcloud helpers + Doppler CLI
        # Ray drives `ray up` / `ray submit` / `ray down` locally; the
        # version pin matches the cluster.yaml docker image. The Doppler
        # CLI fetches GCP creds at runtime so the GCP secrets stay in
        # one place instead of accumulating GH-Actions copies.
        env:
          RAY_VERSION_INPUT: ${{ inputs.ray_version }}
        run: |
          pip install --upgrade pip
          # Install the requested Ray (matches CI's `ray[default]>=2.0`), then render
          # the cluster's docker image to the SAME version so launcher==cluster and
          # both carry the Ray Data API the distributed pipeline needs
          # (`repartition(num_partitions, keys=[...])`, added after 2.43 -- the old
          # pin made the golden/WCC steps TypeError on `keys`).
          if [ -n "${RAY_VERSION_INPUT:-}" ]; then
            echo "Pinning Ray to $RAY_VERSION_INPUT (dispatch input)"
            pip install "ray[default]==$RAY_VERSION_INPUT" "google-api-python-client"
          else
            echo "::warning::ray_version empty -- floating to latest. Pin it instead: a sweep against a moving Ray varies two things at once."
            pip install "ray[default]" "google-api-python-client"
          fi
          pip install pyyaml
          RAY_VER=$(python -c "import ray; print(ray.__version__)")
          echo "RAY_VER=$RAY_VER" >> "$GITHUB_ENV"
          echo "Resolved Ray version: $RAY_VER (launcher + cluster docker image)"
          # Doppler CLI: official install script. We use only
          # `doppler secrets get --plain`, which a service token authorizes
          # directly -- no login step.
          curl -Ls --tlsv1.2 --proto "=https" --retry 3 https://cli.doppler.com/install.sh | sudo sh -s -- --no-package-manager
          doppler --version

      - name: Fetch GCP creds from Doppler
        # Pull GCP_PROJECT_ID and the SA key from Doppler project `showcase`,
        # config `dev`. Both live in the service token, so no project/config
        # flags and no login round-trip -- the token IS the scope. The values
        # are masked in later logs via ::add-mask::; the SA JSON is written to
        # disk and GOOGLE_APPLICATION_CREDENTIALS points at it, and the project
        # id is exported job-scope so the render + sweep steps see it without
        # reaching for ${{ secrets.* }} again.
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${DOPPLER_TOKEN:-}" ]; then
            echo "::error::DOPPLER_TOKEN not set; see docs/distributed/ray-gce-cluster.md"
            exit 1
          fi

          # GCP_RAY_BENCH_PROJECT_ID is the project where the bench SA lives
          # and the required APIs are enabled (golden-490919). The team's
          # GOOGLE_CLOUD_PROJECT points elsewhere (a gen-lang-client-* Vertex
          # project) -- using it would 403 the SA on every
          # cloudresourcemanager call. Surfaced locally as GCP_PROJECT_ID.
          GCP_PROJECT_ID=$(doppler secrets get GCP_RAY_BENCH_PROJECT_ID --plain)
          if [ -z "$GCP_PROJECT_ID" ]; then
            echo "::error::GCP_RAY_BENCH_PROJECT_ID came back empty from Doppler."
            exit 1
          fi
          echo "::add-mask::$GCP_PROJECT_ID"

          # SA key is stored base64-encoded under GCP_SA_KEY_B64. Decode
          # straight to disk (never echo). `--ignore-garbage` tolerates any
          # stray whitespace around the value.
          doppler secrets get GCP_SA_KEY_B64 --plain             | base64 -d --ignore-garbage > "$HOME/gcp-sa.json"
          chmod 600 "$HOME/gcp-sa.json"

          # Sanity: the decoded file must be a JSON object. Validates the
          # base64 round-trip without echoing the contents.
          python3 -c "import json; json.load(open('$HOME/gcp-sa.json'))"

          echo "GCP_PROJECT_ID=$GCP_PROJECT_ID" >> $GITHUB_ENV
          echo "GOOGLE_APPLICATION_CREDENTIALS=$HOME/gcp-sa.json" >> $GITHUB_ENV

      - name: Render cluster.yaml with project + git SHA
        env:
          # Through the environment, not interpolated into the script body: a
          # `${{ }}` expansion inside `run:` is a template-injection seam.
          ZONE_INPUT: ${{ inputs.zone }}
          CLUSTER_DEBUG_INPUT: ${{ inputs.cluster_debug }}
        run: |
          set -euo pipefail
          # GCP_PROJECT_ID is in $GITHUB_ENV from the Doppler fetch
          # step. Inject project_id, git SHA, cluster_name, max_workers.
          sed -i "s|GOLDENMATCH_GCP_PROJECT_PLACEHOLDER|$GCP_PROJECT_ID|g" .ray/cluster-gce.yaml
          sed -i "s|GOLDENMATCH_GIT_SHA_PLACEHOLDER|${{ github.sha }}|g" .ray/cluster-gce.yaml
          sed -i "s|cluster_name: goldenmatch-bench$|cluster_name: ${{ env.CLUSTER_NAME }}|" .ray/cluster-gce.yaml
          sed -i "s|max_workers: 3$|max_workers: ${{ inputs.max_workers }}|" .ray/cluster-gce.yaml
          sed -i "s|GOLDENMATCH_HEAD_MACHINE_PLACEHOLDER|${{ inputs.head_machine }}|g" .ray/cluster-gce.yaml
          sed -i "s|GOLDENMATCH_ZONE_PLACEHOLDER|${ZONE_INPUT}|g" .ray/cluster-gce.yaml
          sed -i "s|GOLDENMATCH_CLUSTER_DEBUG_PLACEHOLDER|${CLUSTER_DEBUG_INPUT}|g" .ray/cluster-gce.yaml
          # Region is the zone minus its trailing letter. Derived, not a second
          # input, so the pair cannot disagree.
          REGION="${ZONE_INPUT%-*}"
          echo "zone=${ZONE_INPUT} -> region=${REGION}"
          sed -i "s|GOLDENMATCH_REGION_PLACEHOLDER|${REGION}|g" .ray/cluster-gce.yaml
          # Pin the cluster docker image to the launcher's resolved Ray version so
          # the cluster has the same Ray Data API (repartition keys=) as the code.
          sed -i "s|GOLDENMATCH_RAY_VERSION_PLACEHOLDER|${RAY_VER}|g" .ray/cluster-gce.yaml
          echo "----- Rendered cluster.yaml -----"
          head -50 .ray/cluster-gce.yaml

      - name: Pre-flight - sweep orphaned bench instances
        # #958 part 1: stale `ray-goldenmatch-bench-*` instances from prior
        # cancelled runs (the `ray down`-orphaned worker, see teardown) pile up,
        # cost money, and eat the GCP CPU/SSD/IP quota that then starves THIS
        # run's autoscaler so workers silently never launch. Delete bench
        # instances created before the 120-min job cap -- they cannot belong to
        # a live run, so this never touches a concurrent bench. Also activates
        # gcloud for the worker-join check below.
        run: |
          set -uo pipefail
          if [ -z "${GCP_PROJECT_ID:-}" ]; then
            echo "GCP_PROJECT_ID not in env yet; skipping pre-flight sweep."
            exit 0
          fi
          gcloud auth activate-service-account \
            --key-file="$GOOGLE_APPLICATION_CREDENTIALS" \
            --project="$GCP_PROJECT_ID" || true
          CUTOFF=$(date -u -d '2 hours ago' '+%Y-%m-%dT%H:%M:%SZ' 2>/dev/null \
            || python -c "import datetime; print((datetime.datetime.utcnow()-datetime.timedelta(hours=2)).strftime('%Y-%m-%dT%H:%M:%SZ'))")
          echo "Sweeping orphaned ray-goldenmatch-bench-* instances created before $CUTOFF ..."
          gcloud compute instances list \
            --filter="name~^ray-goldenmatch-bench- AND creationTimestamp<'$CUTOFF'" \
            --project="$GCP_PROJECT_ID" \
            --format="value(name,zone)" 2>/dev/null | while read name zone; do
              if [ -n "$name" ]; then
                echo "  deleting orphan: $name ($zone)"
                gcloud compute instances delete "$name" \
                  --zone="$zone" --project="$GCP_PROJECT_ID" --quiet || true
              fi
            done

      - name: Ray up
        # Provisions head + workers, installs goldenmatch on each via
        # the setup_commands block. Typical wall: ~3-5 min.
        run: |
          ray up -y --no-config-cache .ray/cluster-gce.yaml

      - name: Verify workers joined
        # #958 part 1: the autoscaler can loop "Adding 1 node -> Resized to N
        # CPUs" WITHOUT ever launching workers (quota exhausted), and the run
        # then crawls HEAD-ONLY with no error for the whole job. Fail LOUDLY if
        # the expected workers don't appear within the deadline instead of
        # wasting an hour. Counting GCE worker instances is more reliable than
        # parsing `ray status` across Ray versions.
        run: |
          set -uo pipefail
          if [ -z "${GCP_PROJECT_ID:-}" ]; then
            echo "GCP_PROJECT_ID not in env; cannot verify workers -- skipping."
            exit 0
          fi
          EXPECTED=${{ inputs.max_workers }}
          DEADLINE=$(( $(date +%s) + 600 ))   # 10 min for workers to come up
          while true; do
            N=$(gcloud compute instances list \
                  --filter="name~^ray-${{ env.CLUSTER_NAME }}-worker AND status=RUNNING" \
                  --project="$GCP_PROJECT_ID" --format="value(name)" 2>/dev/null \
                  | wc -l | tr -d ' ')
            echo "workers RUNNING: ${N}/${EXPECTED}"
            if [ "${N:-0}" -ge "$EXPECTED" ]; then echo "all $EXPECTED workers up."; break; fi
            if [ "$(date +%s)" -ge "$DEADLINE" ]; then
              echo "::error::Only ${N}/${EXPECTED} workers launched within 10 min. The run would proceed HEAD-ONLY (slow). Most common cause: GCP quota (N2 CPUs / SSD / in-use IPs) exhausted in the zone -- check for leftover ray-goldenmatch-bench-* instances and your quota."
              exit 1
            fi
            sleep 30
          done

      - name: Verify native loaded on a worker
        # The scoring kernel is the dominant distributed stage; if the native
        # wheel didn't build on the workers, NATIVE=1 (set in cluster-gce.yaml)
        # would only RAISE at the first score call -- 20+ min into the run.
        # Catch it here: ship a check via `ray submit` (same mechanism the bench
        # uses) that schedules tasks across the cluster and asserts a WORKER
        # actually loaded goldenmatch._native. Fail loud + tear down rather than
        # burn a full run scoring in pure Python.
        run: |
          set -euo pipefail
          ray submit .ray/cluster-gce.yaml scripts/verify_cluster_native.py

      - name: Record the resolved environment
        # Pins say what we ASKED for; this records what actually landed, which is
        # the only thing a later comparison can trust. Two axes drifted silently
        # between the June rung and the 2026-08-25 re-run, and neither was
        # recoverable afterwards:
        #   - every Python dependency floated (now pinned in cluster-gce.yaml)
        #   - the two runs landed in different ZONES, and n2 spans several CPU
        #     generations, so "same machine type" did not mean same hardware.
        # GCE reports the actual platform per instance, so capture it rather than
        # constrain it: minCpuPlatform costs availability, and three of four
        # zones were already capacity-short on n2-highmem-32.
        if: always()
        env:
          # Through the environment, not interpolated into the script body: a
          # `${{ }}` expansion inside `run:` is a template-injection seam.
          LABEL: ${{ inputs.label }}
          CLUSTER: ${{ env.CLUSTER_NAME }}
        run: |
          set -uo pipefail
          mkdir -p .profile_tmp/qis
          OUT=".profile_tmp/qis/env_${LABEL}.md"
          {
            echo "### bench environment"
            echo ""
            echo "| node | machine type | CPU platform |"
            echo "|---|---|---|"
            gcloud compute instances list \
              --filter="name~^ray-${CLUSTER}" \
              --project="$GCP_PROJECT_ID" \
              --format="value(name,machineType.basename(),cpuPlatform)" 2>/dev/null \
              | while read -r nm mt cp; do echo "| $nm | $mt | $cp |"; done
          } | tee "$OUT" >> $GITHUB_STEP_SUMMARY || true
          # The exact resolved wheel set, from the head node itself.
          ray rsync-down .ray/cluster-gce.yaml /tmp/bench_env.txt ".profile_tmp/qis/pipfreeze_${LABEL}.txt" || echo "could not fetch pip freeze from the head (non-fatal)"

      - name: Submit bench
        # `ray submit` ships the script to the head node and runs it.
        # The script writes its JSON output to /tmp on the head; we
        # rsync it back via `ray rsync-down` after the run.
        #
        # We background a `ray status` poller (every 30s) so the GH
        # live log shows head/worker resource use and per-node state
        # interleaved with bench stdout. Without this, the only
        # signal mid-run is autoscaler "Resized to N CPUs" lines and
        # whatever the bench script chooses to print.
        env:
          # Read through the environment rather than interpolated into the
          # script body: a `${{ }}` expansion inside `run:` is a template
          # injection seam, and these are free-text dispatch inputs.
          SCORE_NUM_CPUS: ${{ inputs.score_num_cpus }}
          SCORE_CONCURRENCY: ${{ inputs.score_concurrency }}
          SCORE_PROJECT: ${{ inputs.score_project }}
          OP_RESERVATION: ${{ inputs.op_reservation }}
          SHUFFLE_PARTS: ${{ inputs.shuffle_parts }}
          CLUSTERING_THRESHOLD: ${{ inputs.clustering_threshold }}
          PAIRS_CACHE: ${{ inputs.pairs_cache }}
          DISTRIBUTED: ${{ inputs.distributed }}
          BUCKET_DEBUG: ${{ inputs.bucket_debug }}
        run: |
          set -euo pipefail
          mkdir -p .profile_tmp/qis
          OUT_REMOTE="/tmp/qis_${{ inputs.label }}.json"

          # #957 score-tuning knobs. They travel as FLAGS in the argv the
          # submit already ships, because `ray submit` hands the driver a fresh
          # shell -- exporting them in this step would never reach it. An empty
          # input contributes no flag, so the engine default stays in force.
          KNOBS=()
          if [ -n "$SCORE_NUM_CPUS" ]; then KNOBS+=(--score-num-cpus "$SCORE_NUM_CPUS"); fi
          if [ -n "$SCORE_CONCURRENCY" ]; then KNOBS+=(--score-concurrency "$SCORE_CONCURRENCY"); fi
          if [ -n "$OP_RESERVATION" ]; then KNOBS+=(--op-reservation "$OP_RESERVATION"); fi
          if [ -n "$SHUFFLE_PARTS" ]; then KNOBS+=(--shuffle-parts "$SHUFFLE_PARTS"); fi
          if [ -n "$CLUSTERING_THRESHOLD" ]; then KNOBS+=(--clustering-threshold "$CLUSTERING_THRESHOLD"); fi
          if [ -n "$PAIRS_CACHE" ]; then KNOBS+=(--pairs-cache "$PAIRS_CACHE"); fi
          case "$SCORE_PROJECT" in
            1) KNOBS+=(--score-project) ;;
            0) KNOBS+=(--no-score-project) ;;
            "") ;;
            *) echo "::error::score_project must be 1, 0, or empty (got '$SCORE_PROJECT')"; exit 1 ;;
          esac
          if [ "$BUCKET_DEBUG" = "1" ]; then
            # The scorer runs inside the Ray WORKERS, so this has to be set on
            # the cluster rather than in this shell. Written into the container's
            # bashrc so every later `docker exec` -- including the ray submit
            # driver and the raylet's children -- picks it up.
            echo "enabling GOLDENMATCH_BUCKET_DEBUG on all nodes"
            ray exec .ray/cluster-gce.yaml               "echo 'export GOLDENMATCH_BUCKET_DEBUG=1' >> ~/.bashrc" ||               echo "::warning::could not set BUCKET_DEBUG on the cluster; continuing without it"
          fi
          # `${KNOBS[@]+...}` guards the empty-array case under `set -u`.
          echo "score knobs -> ${KNOBS[*]+${KNOBS[*]}}"
          if [ "$DISTRIBUTED" != "1" ] && [ ${#KNOBS[@]} -gt 0 ]; then
            echo "::error::score knobs were set but distributed=0. The legacy backend=ray path never enters the block-shuffle score stage, so they would measure nothing. Re-dispatch with distributed=1."
            exit 1
          fi

          # Background poller. Runs in a subshell so we can trap-kill
          # it cleanly on bench completion regardless of exit code.
          (
            while true; do
              echo "===== ray status @ $(date -u +%H:%M:%S) ====="
              ray exec .ray/cluster-gce.yaml "ray status" 2>&1 \
                | grep -E "Node status|Active|Pending|Recent|Resources|CPU|memory|object_store|Healthy|Unhealthy" \
                || echo "ray status poll failed (transient SSH/docker issue)"
              echo ""
              sleep 30
            done
          ) &
          POLLER_PID=$!
          # Trap fires on script exit (success OR failure) to release
          # the poller PID and its SSH control-master connections.
          trap "kill $POLLER_PID 2>/dev/null || true" EXIT

          if [ "${{ inputs.distributed }}" = "1" ]; then
            # REAL Phase-5 distributed engine: PIPELINE=2 (block-shuffle +
            # randomized-contraction WCC), oracle-scored. Always frozen config.
            # --wcc-scratch sets GOLDENMATCH_DISTRIBUTED_WCC_SCRATCH on the head
            # (env vars don't propagate through `ray submit`); it MUST be a shared
            # gs:// path the cluster nodes can read+write.
            ray submit .ray/cluster-gce.yaml \
              scripts/quality_invariant_scale.py \
              -- --rows ${{ inputs.rows }} \
                 --shape ${{ inputs.shape }} \
                 --frozen \
                 --corruption moderate \
                 --distributed \
                 --partitions ${{ inputs.partitions }} \
                 --wcc-scratch "${{ inputs.wcc_scratch }}/${{ github.run_id }}" \
                 ${KNOBS[@]+"${KNOBS[@]}"} \
                 --out "$OUT_REMOTE"
          else
            # Legacy: in-memory backend=ray (does NOT distribute; head-only).
            ray submit .ray/cluster-gce.yaml \
              scripts/quality_invariant_scale.py \
              -- --rows ${{ inputs.rows }} \
                 --shape ${{ inputs.shape }} \
                 --backend ray \
                 --out "$OUT_REMOTE"
          fi
          # `rsync-down` (hyphen) -- the latest Ray CLI renamed the underscore
          # form (`rsync_down`), which silently lost the result JSON even though
          # the run completed (#958 part 3).
          ray rsync-down .ray/cluster-gce.yaml \
            "$OUT_REMOTE" ".profile_tmp/qis/qis_${{ inputs.label }}.json"

      - name: Upload bench artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v4
        with:
          name: "qis-${{ inputs.label }}"
          # The result AND the environment that produced it. A rung number whose
          # environment was not captured cannot be compared to anything later --
          # that is exactly how the June baseline became unattributable.
          path: |
            .profile_tmp/qis/qis_${{ inputs.label }}.json
            .profile_tmp/qis/env_${{ inputs.label }}.md
            .profile_tmp/qis/pipfreeze_${{ inputs.label }}.txt
          if-no-files-found: warn

      - name: Ray down (always)
        # The teardown runs even when previous steps fail so we don't
        # leak GCE instances. --workers-only first to release the
        # expensive workers fast, then the head.
        if: always()
        run: |
          ray down -y --workers-only .ray/cluster-gce.yaml || true
          ray down -y .ray/cluster-gce.yaml || true

      - name: Defensive cleanup (instance-list sweep)
        # Belt-and-braces: if `ray down` somehow missed instances,
        # delete any GCE instance carrying our cluster name label.
        # Suppress errors so the workflow doesn't itself fail here.
        if: always()
        run: |
          # $GCP_PROJECT_ID + $GOOGLE_APPLICATION_CREDENTIALS were
          # exported in $GITHUB_ENV by the Doppler fetch step.
          if [ -z "${GCP_PROJECT_ID:-}" ]; then
            echo "GCP_PROJECT_ID not in env -- earlier step failed before the Doppler fetch; nothing to sweep."
            exit 0
          fi
          gcloud auth activate-service-account \
            --key-file="$GOOGLE_APPLICATION_CREDENTIALS" \
            --project="$GCP_PROJECT_ID" || true
          # Match BOTH the ray label AND the instance-name prefix. Autoscaler-
          # launched workers (ray-<cluster>-worker-*) don't always carry the
          # ray-cluster-name label, so a label-only filter missed exactly the
          # orphaned worker `ray down` left behind on cancel (#958 part 2).
          gcloud compute instances list \
            --filter="labels.ray-cluster-name=${{ env.CLUSTER_NAME }} OR name~^ray-${{ env.CLUSTER_NAME }}-" \
            --project="$GCP_PROJECT_ID" \
            --format="value(name,zone)" 2>/dev/null | while read name zone; do
              if [ -n "$name" ]; then
                gcloud compute instances delete "$name" \
                  --zone="$zone" --project="$GCP_PROJECT_ID" \
                  --quiet || true
              fi
            done

      # Dispatch-only workflows get no scheduled-failure email and never reach
      # main-health, so a failure is visible only to whoever rereads the Actions
      # tab. Run 33174606401 failed and sat unnoticed. Runs LAST so every prior
      # step has a conclusion to report.
      - name: File / update the bench-infra alert issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ZONE: ${{ inputs.zone }}
          HEAD_MACHINE: ${{ inputs.head_machine }}
          MAX_WORKERS: ${{ inputs.max_workers }}
        run: |
          # Name the first failed step so the issue can say capacity vs code
          # without the reader opening the run.
          # Non-fatal: the step runs under `bash -e`, so a 403 or a transient
          # API error here would abort before the issue is filed -- the alert
          # failing silently is the exact failure it exists to prevent.
          FAILED="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs" \
            --jq '[.jobs[].steps[] | select(.conclusion=="failure") | .name] | .[0] // "unknown"' \
            2>/dev/null || echo "unknown")"
          bash scripts/ray_bench_alert.sh "${GITHUB_RUN_ID}" "$FAILED"

      - name: Post headline to step summary
        if: always()
        run: |
          OUT=".profile_tmp/qis/qis_${{ inputs.label }}.json"
          if [ ! -f "$OUT" ]; then
            echo "no rung output -- earlier step failed" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          python - <<'PY' >> $GITHUB_STEP_SUMMARY
          import json, os
          d = json.load(open(os.environ["OUT"]))
          rows = d.get("rows", "?")
          wall = d.get("wall_s", {})
          rss_gb = d.get("rss_mb_peak", 0) / 1024
          f1 = d.get("pairwise", {}).get("f1", "?")
          print(f"## bench-ray-cluster: {rows:,} rows")
          # #957: state the score-tuning configuration alongside the number.
          # A run that reports only its wall cannot be told apart from a run
          # that silently fell back to the defaults.
          knobs = d.get("score_knobs")
          if knobs:
              print("- score knobs: " + ", ".join(
                  f"{k}={v}" for k, v in knobs.items()))
          print(f"- wall: {wall}")
          print(f"- peak RSS: {rss_gb:.2f} GB (driver-side; per-node varies)")
          print(f"- pairwise F1: {f1}")
          PY
        env:
          OUT: ".profile_tmp/qis/qis_${{ inputs.label }}.json"
