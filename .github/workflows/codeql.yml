name: CodeQL

# Static analysis (SAST) for OpenSSF Scorecard. Runs CodeQL across the
# Python + TypeScript surfaces; Rust is skipped (CodeQL's Rust support
# is still experimental as of this writing and the workspace already
# uses cargo audit via the rust_pgrx CI lane).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly fresh sweep on Sunday early-morning UTC.
    - cron: "23 7 * * 0"
  # On-demand run (e.g. to refresh the archived SARIF artifact below without
  # waiting for a push or the weekly sweep).
  workflow_dispatch:

permissions:
  contents: read

# Supersede in-flight scans for the same PR — an iterative re-push cancels the
# prior CodeQL run instead of running a duplicate multi-minute scan to
# completion. On `main` and scheduled sweeps `head_ref` is empty, so the key
# falls back to the unique run_id and those runs are NEVER cancelled.
concurrency:
  group: codeql-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  analyze:
    name: "Analyze (${{ matrix.language }})"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # required for upload-sarif + private repos (no-op on public, kept
      # so the workflow works identically if the repo ever flips).
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language:
          - python
          - javascript-typescript

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81  # v3
        with:
          languages: ${{ matrix.language }}
          # Config file scopes the scan to shipping source (paths-ignore for
          # tests/benchmarks/examples/generated) and pins the query suite
          # (security-extended — the default is too conservative for SAST
          # gating). Single source of truth: .github/codeql/codeql-config.yml.
          config-file: ./.github/codeql/codeql-config.yml

      - name: Autobuild
        # Python + JS are interpreted; autobuild is a no-op but the action
        # still expects the step in the pipeline. Keeping it explicit so
        # the same workflow scales if we add a compiled language later.
        uses: github/codeql-action/autobuild@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81  # v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81  # v3
        with:
          category: "/language:${{ matrix.language }}"
          # Also write the SARIF locally so it can be archived as a build
          # artifact (below). This lets maintainers/automation pull the exact
          # findings via the Actions API without needing code-scanning:read;
          # the analyze action still uploads to the Security tab (upload
          # defaults to true).
          output: sarif-results

      - name: Archive SARIF as a build artifact
        # Always upload — even when the scan surfaces findings — so the
        # artifact is available for offline triage regardless of outcome.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v4
        with:
          name: codeql-sarif-${{ matrix.language }}
          path: sarif-results/*.sarif
          retention-days: 14
          if-no-files-found: warn
