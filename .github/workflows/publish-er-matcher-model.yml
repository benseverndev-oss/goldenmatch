# Publish the trained self-hosted ER-matcher model from Modal to a GitHub
# Release asset, so `goldenmatch[local-llm]` users pull it from GitHub (not the
# HF Hub). Runs on a GitHub-hosted runner, which has direct network to Modal —
# the transfer never touches a developer's machine or a sandboxed environment.
#
# Setup (once): add two repo secrets — MODAL_TOKEN_ID and MODAL_TOKEN_SECRET
# (Settings -> Secrets and variables -> Actions). Then dispatch this workflow.
#
# Usage:
#   1. mode=inventory (default) — lists your Modal volumes; if `volume` is given,
#      lists that volume's files (name + size). Use this to find the artifact.
#   2. mode=publish — downloads `remote_path` from `volume`, (optionally converts
#      + quantizes a HF checkpoint to GGUF), computes sha256, and uploads it as an
#      asset on the `release_tag` GitHub Release.
name: publish-er-matcher-model

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "inventory (list Modal volumes/files) | publish (download + upload to GH release)"
        type: choice
        options: [inventory, publish]
        default: inventory
      volume:
        description: "Modal volume name (inventory ls / publish download source)"
        type: string
        default: ""
      remote_path:
        description: "Path of the model file (or checkpoint dir) inside the Modal volume (publish)"
        type: string
        default: ""
      release_tag:
        description: "GitHub Release tag to create/update with the asset (publish)"
        type: string
        default: "er-matcher-3b-v1"
      quantize:
        description: "Artifact is a HF checkpoint dir: convert + quantize to GGUF Q4_K_M before upload"
        type: boolean
        default: false

permissions:
  contents: write # create the release + upload assets

concurrency:
  group: publish-er-matcher-model
  cancel-in-progress: false

jobs:
  modal-to-gh:
    runs-on: ubuntu-latest
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - name: Verify Modal secrets are present
        run: |
          if [ -z "$MODAL_TOKEN_ID" ] || [ -z "$MODAL_TOKEN_SECRET" ]; then
            echo "::error::MODAL_TOKEN_ID / MODAL_TOKEN_SECRET repo secrets are not set."
            echo "Add them under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Modal client
        run: pip install --upgrade modal

      - name: Inventory — list volumes and files
        if: ${{ inputs.mode == 'inventory' }}
        run: |
          echo "== modal volume list =="
          modal volume list
          if [ -n "${{ inputs.volume }}" ]; then
            echo "== modal volume ls ${{ inputs.volume }} =="
            modal volume ls "${{ inputs.volume }}"
          else
            echo "::notice::Re-run with a 'volume' input to list that volume's files (name + size)."
          fi

      - name: Publish — validate inputs
        if: ${{ inputs.mode == 'publish' }}
        run: |
          test -n "${{ inputs.volume }}"      || { echo "::error::'volume' input is required for publish"; exit 1; }
          test -n "${{ inputs.remote_path }}" || { echo "::error::'remote_path' input is required for publish"; exit 1; }

      - name: Publish — download from Modal
        if: ${{ inputs.mode == 'publish' }}
        run: |
          mkdir -p out
          # `modal volume get` fetches a file or a directory to the local dest.
          modal volume get "${{ inputs.volume }}" "${{ inputs.remote_path }}" out/
          echo "== downloaded =="
          ls -laR out/

      - name: Publish — convert + quantize HF checkpoint to GGUF (optional)
        if: ${{ inputs.mode == 'publish' && inputs.quantize }}
        run: |
          # Only needed when the artifact is a HF-format checkpoint dir rather than
          # a ready .gguf. Produces out/model.q4_k_m.gguf via llama.cpp.
          pip install numpy sentencepiece gguf protobuf transformers
          git clone --depth 1 https://github.com/ggml-org/llama.cpp
          CKPT="$(find out -maxdepth 2 -name 'config.json' -printf '%h\n' | head -1)"
          test -n "$CKPT" || { echo "::error::no HF checkpoint (config.json) found under out/"; exit 1; }
          echo "checkpoint dir: $CKPT"
          python llama.cpp/convert_hf_to_gguf.py "$CKPT" --outfile out/model.f16.gguf --outtype f16
          cmake -S llama.cpp -B llama.cpp/build -DLLAMA_CURL=OFF >/dev/null
          cmake --build llama.cpp/build --target llama-quantize -j >/dev/null
          ./llama.cpp/build/bin/llama-quantize out/model.f16.gguf out/model.q4_k_m.gguf Q4_K_M
          rm -f out/model.f16.gguf

      - name: Publish — pick asset, checksum, size-guard
        if: ${{ inputs.mode == 'publish' }}
        run: |
          ASSET="$(find out -name '*.gguf' -type f | head -1)"
          test -n "$ASSET" || { echo "::error::no .gguf found under out/ (set quantize=true if the artifact is a HF checkpoint)"; exit 1; }
          sha256sum "$ASSET" | tee "$ASSET.sha256"
          SIZE=$(stat -c%s "$ASSET")
          echo "asset=$ASSET"            >> "$GITHUB_ENV"
          echo "asset_sha=$ASSET.sha256" >> "$GITHUB_ENV"
          echo "size $SIZE bytes ($(numfmt --to=iec "$SIZE"))"
          if [ "$SIZE" -gt $((2 * 1024 * 1024 * 1024)) ]; then
            echo "::error::asset exceeds GitHub's 2 GiB per-file release-asset cap. Use a smaller quant (Q4_0 / Q3_K_M) or split the file."
            exit 1
          fi

      - name: Publish — upload to GitHub Release
        if: ${{ inputs.mode == 'publish' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.release_tag }}"
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --title "$TAG" \
                 --notes "GoldenMatch self-hosted ER-matcher model artifact (GGUF). Pulled by goldenmatch[local-llm]."
          gh release upload "$TAG" "$asset" "$asset_sha" --clobber
          echo "::notice::Uploaded $asset to release $TAG."
          echo "== pin these in goldenmatch/core/_llm_loader.py PINNED_MODEL =="
          echo "asset name: $(basename "$asset")"
          echo "sha256:     $(cut -d' ' -f1 "$asset_sha")"
          echo "url:        $(gh release view "$TAG" --json assets --jq '.assets[] | select(.name==("'"$(basename "$asset")"'")) | .url')"
