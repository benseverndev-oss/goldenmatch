# FS out-of-core SCALE PROOF -- the empirical answer to "how far past the
# in-memory memory ceiling does the streaming FS path take a single 64 GB box?".
#
# 50M PROOF (run #3, head 716bd42, 2026-07-30): the STREAMING leg COMPLETED a 50M
# dedupe at representative width (filler_cols=8) in ~13 min on large-new-64GB,
# while the IN-MEMORY baseline climbed to ~56 GB and the runner was reclaimed
# mid-thrash (heading to the ~82 GB OOM). In-memory hits the wall; streaming
# clears it. The in-memory baseline is proven + inherently runner-hostile (near-
# OOM thrash reclaims the shared runner), so this workflow now runs STREAMING
# ONLY -- the ladder just needs to show how far streaming goes.
#
# SCALE-OUT ladder (100M -> 300M) uses NARROW columns (filler_cols=0) so the
# still-un-streamed PREP frame (~1x frame) stays under 64 GB and the BACK-HALF
# scaling (frame-free + DuckDB spill + golden batch + pair spill + Rust streaming
# Union-Find) is what's exercised. NOT in ci-required.
#
# NOTE (temporary): the branch-scoped `push` trigger fires this from the feature
# branch (a brand-new workflow_dispatch can't be dispatched until it lands on the
# default branch). REMOVE the `push:` block before this PR is marked ready --
# the merged workflow is dispatch-only.
name: bench-fs-ooc-scale

on:
  workflow_dispatch:
    inputs:
      rows:
        description: "Row count"
        type: string
        default: "200000000"
      filler_cols:
        description: "Extra string columns (0 = narrow scale-out shape; ~8 = representative width)"
        type: string
        default: "0"
      avg_block:
        description: "Average block size (zip pool = rows/avg_block)"
        type: string
        default: "8"
      runner:
        description: "Runner label"
        type: string
        default: "large-new-64GB"
  push:
    branches: ["claude/polars-pyarrow-migration-phases-jst8ne"]
    paths:
      - ".github/workflows/bench-fs-ooc-scale.yml"
      - "packages/python/goldenmatch/scripts/bench_fs_streaming_peak.py"

permissions:
  contents: read

env:
  ARROW_DEFAULT_MEMORY_POOL: system
  _RJEM_MALLOC_CONF: "dirty_decay_ms:1000,muzzy_decay_ms:0"
  GOLDENMATCH_AUTOCONFIG_MEMORY: "0"

concurrency:
  # newest push wins -- supersede a still-running (or stuck) bench of this ref.
  group: bench-fs-ooc-scale-${{ github.ref }}
  cancel-in-progress: true

jobs:
  streaming:
    runs-on: ${{ github.event.inputs.runner || 'large-new-64GB' }}
    timeout-minutes: 240
    env:
      ROWS: ${{ github.event.inputs.rows || '200000000' }}
      FILLER_COLS: ${{ github.event.inputs.filler_cols || '0' }}
      AVG_BLOCK: ${{ github.event.inputs.avg_block || '8' }}
      BENCH: packages/python/goldenmatch/scripts/bench_fs_streaming_peak.py
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Sync workspace (installs goldenmatch @ HEAD)
        run: uv sync --all-packages
      - name: Build the native kernel (streaming Union-Find + FS kernels)
        run: uv run python scripts/build_native.py

      - name: Streaming out-of-core (must COMPLETE)
        run: |
          set -o pipefail
          timeout 210m uv run python "$BENCH" --mode streaming \
            --rows "$ROWS" --filler-cols "$FILLER_COLS" --avg-block "$AVG_BLOCK" \
            2>&1 | tee bench.log
          grep -q "RESULT mode=streaming .* status=completed" bench.log

      - name: Summary
        if: always()
        run: |
          {
            echo "## FS out-of-core streaming scale -- rows=\`$ROWS\` filler_cols=\`$FILLER_COLS\`"
            echo '```'
            grep -E "RESULT|\[rss\]" bench.log | tail -4 || echo "(no output -- did not complete)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fs-ooc-scale-streaming-${{ env.ROWS }}
          path: bench.log
