# FS out-of-core SCALE PROOF -- the empirical answer to "does the streaming FS
# path clear the memory ceiling a single box hits in-memory?".
#
# Two INDEPENDENT matrix legs (separate runners, fail-fast: false) so the
# in-memory baseline's near-OOM thrash can't take the streaming leg down with it
# (the single-job v1 got its runner reclaimed mid in-memory-climb before streaming
# ever ran):
#   * streaming (=1): the bounded out-of-core path -- the GATE. Must COMPLETE
#     (asserted via the RESULT line). This is the proof.
#   * in-memory (=0): the classic pipeline baseline -- INFORMATIONAL
#     (continue-on-error), TIME-BOUNDED (a 50M in-memory run climbs past ~56 GB and
#     thrashes a 64 GB box; a hard timeout captures the memory-bound climb in the
#     RSS log and kills it cleanly before the runner gets reclaimed).
#
# Scale-out (100M/200M/300M) uses NARROW columns (filler_cols=0) so the still-
# un-streamed prep frame (~1x frame) stays under 64 GB and the BACK-HALF scaling
# is what's exercised. NOT in ci-required -- a dispatch-only scale proof.
#
# NOTE (temporary): the branch-scoped `push` trigger fires this from the feature
# branch (a brand-new workflow_dispatch can't be dispatched until it lands on the
# default branch). REMOVE the `push:` block before this PR is marked ready --
# the merged workflow is dispatch-only.
name: bench-fs-ooc-scale

on:
  workflow_dispatch:
    inputs:
      rows:
        description: "Row count"
        type: string
        default: "50000000"
      filler_cols:
        description: "Extra string columns (widen the frame; ~8 = representative, 0 = narrow scale-out)"
        type: string
        default: "8"
      avg_block:
        description: "Average block size (zip pool = rows/avg_block)"
        type: string
        default: "8"
      runner:
        description: "Runner label"
        type: string
        default: "large-new-64GB"
  push:
    branches: ["claude/polars-pyarrow-migration-phases-jst8ne"]
    paths:
      - ".github/workflows/bench-fs-ooc-scale.yml"
      - "packages/python/goldenmatch/scripts/bench_fs_streaming_peak.py"

permissions:
  contents: read

env:
  ARROW_DEFAULT_MEMORY_POOL: system
  _RJEM_MALLOC_CONF: "dirty_decay_ms:1000,muzzy_decay_ms:0"
  GOLDENMATCH_AUTOCONFIG_MEMORY: "0"

concurrency:
  # newest push wins -- supersede a still-running (or stuck) bench of this ref.
  group: bench-fs-ooc-scale-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scale:
    strategy:
      fail-fast: false
      matrix:
        mode: [streaming, in-memory]
    # The in-memory baseline is informational -- it OOMs/thrashes by design, so a
    # failed/timed-out leg must not fail the workflow. The streaming leg is the gate.
    continue-on-error: ${{ matrix.mode == 'in-memory' }}
    runs-on: ${{ github.event.inputs.runner || 'large-new-64GB' }}
    timeout-minutes: 200
    env:
      ROWS: ${{ github.event.inputs.rows || '50000000' }}
      FILLER_COLS: ${{ github.event.inputs.filler_cols || '8' }}
      AVG_BLOCK: ${{ github.event.inputs.avg_block || '8' }}
      BENCH: packages/python/goldenmatch/scripts/bench_fs_streaming_peak.py
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Sync workspace (installs goldenmatch @ HEAD)
        run: uv sync --all-packages
      - name: Build the native kernel (streaming Union-Find + FS kernels)
        run: uv run python scripts/build_native.py

      - name: Streaming out-of-core (GATE -- must COMPLETE)
        if: ${{ matrix.mode == 'streaming' }}
        run: |
          set -o pipefail
          timeout 170m uv run python "$BENCH" --mode streaming \
            --rows "$ROWS" --filler-cols "$FILLER_COLS" --avg-block "$AVG_BLOCK" \
            2>&1 | tee bench.log
          grep -q "RESULT mode=streaming .* status=completed" bench.log

      - name: In-memory baseline (informational -- expected memory-bound)
        if: ${{ matrix.mode == 'in-memory' }}
        run: |
          # Time-bounded: a 50M in-memory run climbs past ~56 GB in <10 min; a hard
          # cap captures that climb and kills it cleanly (124) before the thrashing
          # runner is reclaimed. `|| true` -> never fails (continue-on-error too).
          timeout 25m uv run python "$BENCH" --mode in-memory \
            --rows "$ROWS" --filler-cols "$FILLER_COLS" --avg-block "$AVG_BLOCK" \
            2>&1 | tee bench.log || true
          echo "---"
          if grep -q "RESULT mode=in-memory .* status=completed" bench.log; then
            echo "in-memory COMPLETED (did not hit the ceiling at this size/width)"
          else
            echo "in-memory did NOT complete (memory-bound) -- peak RSS climb:"
            grep -E "\[rss\]" bench.log | tail -3 || true
          fi

      - name: Summary
        if: always()
        run: |
          {
            echo "## FS out-of-core scale proof -- \`${{ matrix.mode }}\`"
            echo "rows=\`$ROWS\` filler_cols=\`$FILLER_COLS\` avg_block=\`$AVG_BLOCK\`"
            echo '```'
            grep -E "RESULT|\[rss\]" bench.log | tail -4 || echo "(no output)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fs-ooc-scale-${{ matrix.mode }}-${{ env.ROWS }}
          path: bench.log
