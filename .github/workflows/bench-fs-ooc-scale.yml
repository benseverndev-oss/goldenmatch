# FS out-of-core SCALE PROOF -- the empirical answer to "does the streaming FS
# path clear the memory ceiling a single box hits in-memory?".
#
# Runs the REAL zero-config-shaped FS dedupe (explicit probabilistic config, zip
# blocking) at N rows on a 64 GB box, in two modes, and compares:
#   * in-memory (GOLDENMATCH_FS_OUT_OF_CORE=0): the classic pipeline -- expected
#     to OOM (~82 GB projected at 50M, killed -> non-zero exit) at representative
#     width. This is the BASELINE the streaming path must beat.
#   * streaming (=1): the bounded out-of-core path (frame freed at load, DuckDB
#     spill, golden batched, pair stream spilled, Rust streaming Union-Find) --
#     must COMPLETE with a bounded peak.
#
# Scale-out (100M/200M/300M) uses NARROW columns (filler_cols=0) so the still-
# un-streamed prep frame (~1x frame) stays under 64 GB and the BACK-HALF scaling
# is what's exercised. NOT in ci-required -- a dispatch-only scale proof.
#
# NOTE (temporary): the branch-scoped `push` trigger fires this from the feature
# branch (a brand-new workflow_dispatch can't be dispatched until it lands on the
# default branch). REMOVE the `push:` block before this PR is marked ready --
# the merged workflow is dispatch-only.
name: bench-fs-ooc-scale

on:
  workflow_dispatch:
    inputs:
      rows:
        description: "Row count"
        type: string
        default: "50000000"
      filler_cols:
        description: "Extra string columns (widen the frame; ~8 = representative, 0 = narrow scale-out)"
        type: string
        default: "8"
      avg_block:
        description: "Average block size (zip pool = rows/avg_block)"
        type: string
        default: "8"
      run_in_memory:
        description: "Also run the in-memory baseline (expected OOM at 50M)"
        type: boolean
        default: true
      runner:
        description: "Runner label"
        type: string
        default: "large-new-64GB"
  push:
    branches: ["claude/polars-pyarrow-migration-phases-jst8ne"]
    paths:
      - ".github/workflows/bench-fs-ooc-scale.yml"
      - "packages/python/goldenmatch/scripts/bench_fs_streaming_peak.py"

permissions:
  contents: read

env:
  # pyarrow's bundled mimalloc SIGSEGVs on goldenmatch's pipeline worker threads;
  # force the system pool (the #1627 remedy). Required for any at-scale pipeline run.
  ARROW_DEFAULT_MEMORY_POOL: system
  # jemalloc page-decay: return freed polars pages to the OS between stages
  # (root CLAUDE.md scale standard; -33% peak at 1M).
  _RJEM_MALLOC_CONF: "dirty_decay_ms:1000,muzzy_decay_ms:0"
  GOLDENMATCH_AUTOCONFIG_MEMORY: "0"

concurrency:
  group: bench-fs-ooc-scale-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scale-proof:
    runs-on: ${{ github.event.inputs.runner || 'large-new-64GB' }}
    timeout-minutes: 240
    env:
      ROWS: ${{ github.event.inputs.rows || '50000000' }}
      FILLER_COLS: ${{ github.event.inputs.filler_cols || '8' }}
      AVG_BLOCK: ${{ github.event.inputs.avg_block || '8' }}
      BENCH: packages/python/goldenmatch/scripts/bench_fs_streaming_peak.py
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Sync workspace (installs goldenmatch @ HEAD)
        run: uv sync --all-packages
      - name: Build the native kernel (streaming Union-Find + FS kernels)
        run: uv run python scripts/build_native.py

      - name: In-memory baseline (expected OOM at 50M)
        id: inmem
        if: ${{ github.event.inputs.run_in_memory != 'false' }}
        run: |
          # Never fail the job here -- an OOM kill (137) or a near-OOM hang
          # (timeout -> 124) IS the baseline evidence. `timeout` caps it so a
          # thrashing baseline can't eat the whole job budget.
          if timeout 100m uv run python "$BENCH" --mode in-memory \
              --rows "$ROWS" --filler-cols "$FILLER_COLS" --avg-block "$AVG_BLOCK" \
              2>&1 | tee inmem.log; then
            echo "code=0" >> "$GITHUB_OUTPUT"
          else
            echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          fi
          echo "in-memory exit code: $(tail -n1 "$GITHUB_OUTPUT")"

      - name: Streaming out-of-core (must COMPLETE)
        id: stream
        run: |
          set -o pipefail
          timeout 120m uv run python "$BENCH" --mode streaming \
            --rows "$ROWS" --filler-cols "$FILLER_COLS" --avg-block "$AVG_BLOCK" \
            2>&1 | tee stream.log
          # Assert the streaming run reached the RESULT completion line.
          grep -q "RESULT mode=streaming .* status=completed" stream.log

      - name: Summary
        if: always()
        run: |
          {
            echo "## FS out-of-core scale proof"
            echo ""
            echo "- rows=\`$ROWS\` filler_cols=\`$FILLER_COLS\` avg_block=\`$AVG_BLOCK\`"
            echo ""
            echo "### in-memory baseline (=0)"
            if [ -f inmem.log ]; then
              echo '```'
              grep -E "RESULT|MemoryError|Killed|error" inmem.log | tail -5 || true
              echo "exit_code=${{ steps.inmem.outputs.code }}"
              echo '```'
              if [ "${{ steps.inmem.outputs.code }}" != "0" ]; then
                echo "-> in-memory did NOT complete (exit ${{ steps.inmem.outputs.code }}) -- the ceiling the streaming path clears."
              fi
            else
              echo "(skipped)"
            fi
            echo ""
            echo "### streaming out-of-core (=1)"
            echo '```'
            grep -E "RESULT" stream.log | tail -2 || echo "no RESULT line -- streaming did not complete"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fs-ooc-scale-${{ env.ROWS }}
          path: |
            inmem.log
            stream.log
