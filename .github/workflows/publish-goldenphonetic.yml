name: Publish goldenphonetic (PyPI + crates.io)

# Publishes the standalone `goldenphonetic` fuzzy-string product on BOTH surfaces:
#   * PyPI: the `goldenphonetic` maturin/abi3 wheel (pure Rust, zero C deps) built
#     across platforms, wrapping the pyo3-free `goldenphonetic-core` crate.
#   * crates.io: the `goldenphonetic-core` Rust crate itself (zero deps, so it
#     publishes standalone).
#
# Fires on a release tagged `goldenphonetic-v*` (kept distinct from every other
# publish tag so nothing cross-triggers). workflow_dispatch with a `ref` allows a
# manual/retro build; the `publish` toggle turns the matrix into a dry run.
#
# Secrets required (configure once): PYPI_TOKEN (already used by the suite) and
# CRATES_IO_TOKEN (crates.io API token). Both jobs `skip-existing`/tolerate an
# already-published version so a re-run is safe.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag or commit to build (default: HEAD of main)"
        required: false
        default: ""
      publish:
        description: "Upload to PyPI / crates.io (uncheck for a build-only dry run)"
        type: boolean
        required: false
        default: true

permissions:
  contents: read

env:
  # One manifest drives every wheel job; abi3 = one wheel per platform (3.11+).
  MANIFEST: packages/rust/extensions/goldenphonetic-py/Cargo.toml

jobs:
  linux:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'goldenphonetic-v')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"
      - name: Build wheels (maturin, abi3, manylinux)
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b  # v1.51.0
        with:
          target: ${{ matrix.target }}
          manylinux: "2_28"
          args: --release --out dist -m ${{ env.MANIFEST }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v4
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist

  windows:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'goldenphonetic-v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"
      - name: Build wheel (maturin, abi3)
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b  # v1.51.0
        with:
          target: x64
          args: --release --out dist -m ${{ env.MANIFEST }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v4
        with:
          name: wheels-windows-x64
          path: dist

  macos:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'goldenphonetic-v')
    # macos-14 (Apple Silicon) cross-builds the x86_64 wheel too; pure Rust, so
    # the cross-compile links cleanly (no prebuilt-runtime constraint).
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64, x86_64]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"
      - name: Build wheel (maturin, abi3)
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b  # v1.51.0
        with:
          target: ${{ matrix.target }}
          args: --release --out dist -m ${{ env.MANIFEST }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v4
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist

  sdist:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'goldenphonetic-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b  # v1.51.0
        with:
          command: sdist
          args: --out dist -m ${{ env.MANIFEST }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v4
        with:
          name: wheels-sdist
          path: dist

  pypi:
    needs: [linux, windows, macos, sdist]
    if: github.event_name != 'workflow_dispatch' || inputs.publish
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b  # release/v1
        with:
          packages-dir: dist
          password: ${{ secrets.PYPI_TOKEN }}
          skip-existing: true

  crates_io:
    # Publish the pyo3-free `goldenphonetic-core` Rust crate to crates.io. Zero deps,
    # so it publishes standalone. Independent of the PyPI wheel jobs.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'goldenphonetic-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
      - name: cargo publish goldenphonetic-core
        if: github.event_name != 'workflow_dispatch' || inputs.publish
        working-directory: packages/rust/extensions/goldenphonetic-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        # Tolerate ONLY the idempotent "this version is already on crates.io" case
        # (safe re-run of a release). Any other non-zero -- auth, unverified email,
        # metadata, network -- is a real failure and MUST fail the job loudly. The
        # old `cargo publish || echo warning` swallowed a genuine 400 (unverified
        # email) and showed green; never disguise a real failure as success again.
        run: |
          set +e
          out=$(cargo publish 2>&1); rc=$?
          echo "$out"
          if [ "$rc" -ne 0 ]; then
            if echo "$out" | grep -qiE "already (uploaded|exists)"; then
              echo "::warning::goldenphonetic-core version already on crates.io -- idempotent re-run, treating as success"
            else
              echo "::error::cargo publish failed for a non-idempotent reason (see log above)"
              exit "$rc"
            fi
          fi
