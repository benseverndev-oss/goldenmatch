# ER head-to-head scale-envelope bench - Splink (DuckDB) vs GoldenMatch.
#
# workflow_dispatch only. Sweeps a lane x shape x scale matrix on ONE 64 GB
# machine with an identical per-scale parquet fixture, so wall + peak-RSS are
# comparable across engines.
#
# Lanes (6, selectable via the `lanes` input):
#   splink                  - Fellegi-Sunter reference engine (pinned version)
#   gm_hand_built           - GM fast weighted bucket+native path (speed reference)
#   gm_probabilistic        - EM-trained FS, numpy fallback (GOLDENMATCH_FS_NATIVE=0)
#   gm_probabilistic_native - same, Rust FS kernel (GOLDENMATCH_FS_NATIVE=1)
#   gm_zeroconfig           - zero-effort controller
#   gm_converted_splink     - GM running Splink's own spec via from_splink
#
# Shapes: person + biblio (default) + product (opt-in). The `shapes` input becomes a job matrix
# (fail-fast: false), so each shape runs on its own runner and uploads its own
# artifact `er-headtohead-<shape>-<run_tag>`.
#
# Memory safety: orchestrate.py runs every (shape, lane, scale) datapoint as an
# isolated subprocess. The OS reclaims each datapoint's memory on exit, and an
# OOM-killed / timed-out datapoint is recorded as `OOM` / `timeout` rather than
# crashing the sweep. The 100M GM bucket tiers are EXPECTED to OOM on a single
# 64 GB box - that ceiling is itself a result.
#
# Sharding: a full 6-lane x 2-shape x 5-scale matrix exceeds a single 600-min
# job. Split it across dispatches by scale band AND by lane (see the README
# dispatch plan). Results are keyed by the stable (shape, lane, scale) triple, so
# merge_results.py can union any set of dispatch artifacts (later-timestamp-wins).
# The dependent `merge` job unions a single dispatch's shape artifacts
# automatically.
#
# To run: GitHub -> Actions -> "bench-er-headtohead" -> Run workflow.
name: bench-er-headtohead

on:
  workflow_dispatch:
    inputs:
      lanes:
        description: "Space-separated lanes to run"
        required: false
        default: "splink gm_hand_built gm_probabilistic gm_probabilistic_native gm_zeroconfig gm_converted_splink"
      shapes:
        description: "Space-separated fixture shapes (person biblio product)"
        required: false
        default: "person biblio"
      scales:
        description: "Space-separated row counts to sweep"
        required: false
        default: "100000 1000000"
      dupe_rate:
        description: "Fraction of duplicate rows in each fixture"
        required: false
        default: "0.20"
      threshold:
        description: "Match threshold"
        required: false
        default: "0.85"
      runner:
        description: "Runner label (needs 64 GB for the heavy tiers)"
        required: false
        default: "large-new-64GB"
      run_tag:
        description: "Tag stamped into artifact names for merge"
        required: false
        default: "manual"
      fail_on_regression:
        description: "cost-aware-offvson lane: fail the job on an F1 regression / biblio-not-exempt"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

# This lane pip-installs splink/duckdb from PyPI and runs the pipeline, so it
# needs the documented mimalloc-SIGSEGV guard (ARROW_DEFAULT_MEMORY_POOL=system).
env:
  ARROW_DEFAULT_MEMORY_POOL: system
  # jemalloc page-decay tuning for polars (its allocator is jemalloc, `_RJEM_`
  # prefix). Default jemalloc holds freed dirty/muzzy pages ~10s for reuse; a
  # staged batch pipeline frees large frames between stages, so those retained
  # pages inflate peak RSS by ~a third with NO live data behind them. Returning
  # muzzy pages immediately (dirty kept 1s for hot reuse) cut the 1M person FS
  # peak 3278->2208 MB (-33%) at +0.8% wall (noise), byte-identical output. The
  # "held frames" the per-stage RSS split showed were mostly RETAINED, not live.
  _RJEM_MALLOC_CONF: "dirty_decay_ms:1000,muzzy_decay_ms:0"
  GOLDENMATCH_AUTOCONFIG_MEMORY: "0"
  # Build EM-training blocks from a bounded frame sample instead of the full
  # frame. Stage-attribution showed the FS dedupe peak is EM's full-frame
  # build_blocks (~11.7 GB native at 1M), NOT the scorer (~274 MB flat); the
  # bucket scorer re-partitions internally and ignores these blocks, and EM
  # only samples ~10k within-block pairs. F1-neutral on the person fixture
  # (0.9802 == full-frame); measuring the peak-RSS drop at 1M here. Only
  # affects the gm_probabilistic lanes (bucket route + trained EM).
  GOLDENMATCH_FS_EM_SAMPLE_ROWS: "100000"

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      shapes: ${{ steps.m.outputs.shapes }}
    steps:
      - id: m
        run: echo "shapes=$(echo '${{ inputs.shapes }}' | jq -R -c 'split(" ")')" >> "$GITHUB_OUTPUT"

  bench:
    needs: setup
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 600
    strategy:
      fail-fast: false
      matrix:
        shape: ${{ fromJSON(needs.setup.outputs.shapes) }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        # native crate's rust-toolchain.toml pins the exact version.

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
        with:
          workspaces: packages/rust/extensions/native

      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39  # v3
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            **/pyproject.toml

      - name: Sync workspace
        run: uv sync --all-packages

      - name: Build native extension (bucket + Arrow + FS kernels)
        run: uv run python scripts/build_native.py

      - name: Install Splink (competitor engine, pinned - not a repo dependency)
        if: contains(inputs.lanes, 'splink') || contains(inputs.lanes, 'gm_converted_splink')
        run: uv pip install splink==4.0.16

      - name: Install DuckDB (used by the engine-agnostic accuracy evaluator)
        run: uv pip install duckdb

      # Resume across a preempted runner. The large-new-64GB runners are
      # occasionally reclaimed mid-sweep ("runner has received a shutdown
      # signal"); orchestrate.py flushes bench_results.json after every datapoint
      # and skips datapoints already recorded, so restoring .bench_er lets a
      # re-run continue instead of recomputing from zero. Unique primary key per
      # (shape, tag, run, attempt) => the post-job save always writes; the
      # prefix restore-keys pick up the most recent partial for this shape+tag
      # (previous attempt first, then any earlier dispatch with the same tag).
      - name: Restore partial sweep progress
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: .bench_er
          key: er-h2h-${{ matrix.shape }}-${{ inputs.run_tag }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            er-h2h-${{ matrix.shape }}-${{ inputs.run_tag }}-${{ github.run_id }}-
            er-h2h-${{ matrix.shape }}-${{ inputs.run_tag }}-

      - name: Run head-to-head sweep
        run: |
          uv run python scripts/bench_er_headtohead/orchestrate.py \
            --scales ${{ inputs.scales }} \
            --shapes ${{ matrix.shape }} \
            --lanes ${{ inputs.lanes }} \
            --dupe-rate ${{ inputs.dupe_rate }} \
            --threshold ${{ inputs.threshold }} \
            --run-tag ${{ inputs.run_tag }} \
            --workdir .bench_er

      - name: Upload results artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v4
        with:
          name: er-headtohead-${{ matrix.shape }}-${{ inputs.run_tag }}
          path: |
            .bench_er/bench_results.json
            .bench_er/summary.md
            .bench_er/results/*.json
          retention-days: 90

  merge:
    needs: bench
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.11"

      # One directory per artifact (NO merge-multiple) so the two shapes'
      # bench_results.json files do not clobber; merge_results.py globs
      # */bench_results.json.
      - name: Download all shape artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          path: merged

      - name: Merge dispatch artifacts (later-timestamp-wins)
        run: |
          python scripts/bench_er_headtohead/merge_results.py \
            --artifacts-dir merged \
            --out-json merged.json \
            --out-md merged.md

      - name: Upload merged artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v4
        with:
          name: er-headtohead-merged-${{ inputs.run_tag }}
          path: |
            merged.json
            merged.md
          retention-days: 90

  # ── Cost-aware blocking OFF vs ON lane (gates the GOLDENMATCH_BLOCKING_COST_AWARE
  #    default flip, mirroring how panel-v1-v2 gated the FS v2 flip) ──────────────
  #
  # Runs the WEIGHTED zero-config path (`run_goldenmatch.py --mode zeroconfig` ->
  # `dedupe_df` -> `build_blocking`), the path the cost-aware demotion (#2021)
  # actually affects, twice per shape (GOLDENMATCH_BLOCKING_COST_AWARE 0 vs 1):
  #   * person  — the WIN: cost-aware demotes the birth_year sole-primary (a ∝N
  #               block that explodes candidate pairs at scale), so pairs collapse
  #               while F1 holds or improves.
  #   * biblio  — the domain-routing EXEMPTION: a publication `year` is a strong
  #               same-year blocking signal, so cost-aware must be a NO-OP here
  #               (OFF == ON on candidate pairs). This is the DBLP-ACM safety the
  #               `_is_bibliographic_dataset` router provides.
  # F1 non-regression on every shape + biblio-is-exempt clears the flip. Independent
  # of the matrix sweep above; workflow_dispatch only, not a gate.
  cost-aware-offvson:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 120
    env:
      GOLDENMATCH_AUTOCONFIG_MEMORY: "0"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
        with:
          workspaces: packages/rust/extensions/native

      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39  # v3
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            **/pyproject.toml

      - name: Sync workspace
        run: uv sync --all-packages

      - name: Build native extension (bucket + Arrow kernels)
        run: uv run python scripts/build_native.py

      - name: Install DuckDB (engine-agnostic accuracy evaluator)
        run: uv pip install duckdb

      - name: Generate + run person & biblio OFF vs ON
        env:
          COST_AWARE_SCALE: "200000"   # >= the 50K learned/exact gate, fast (~min)
        run: |
          set -euo pipefail
          mkdir -p ca_out
          for SHAPE in person biblio; do
            uv run python scripts/bench_er_headtohead/generate_fixture.py \
              --shape "$SHAPE" --rows "$COST_AWARE_SCALE" --dupe-rate 0.20 \
              --out "ca_out/${SHAPE}.parquet" --ground-truth "ca_out/${SHAPE}_gt.parquet"
            for FLAG in 0 1; do
              GOLDENMATCH_BLOCKING_COST_AWARE="$FLAG" uv run python \
                scripts/bench_er_headtohead/run_goldenmatch.py \
                --input "ca_out/${SHAPE}.parquet" --rows "$COST_AWARE_SCALE" \
                --mode zeroconfig --shape "$SHAPE" --allow-pure-python \
                --out "ca_out/${SHAPE}_flag${FLAG}.json" \
                --pred-out "ca_out/${SHAPE}_flag${FLAG}_pred.parquet"
              uv run python scripts/bench_er_headtohead/evaluate.py \
                --pred "ca_out/${SHAPE}_flag${FLAG}_pred.parquet" \
                --truth "ca_out/${SHAPE}_gt.parquet" \
                --out "ca_out/${SHAPE}_flag${FLAG}_eval.json"
            done
          done

      - name: Compare OFF vs ON (verdict -> job summary)
        run: |
          FLAG=""
          if [ "${{ inputs.fail_on_regression }}" = "true" ]; then FLAG="--fail-on-regression"; fi
          uv run python scripts/bench_er_headtohead/compare_cost_aware.py \
            --dir ca_out --shapes person,biblio --out ca_out/compare_cost_aware.md $FLAG

      - name: Upload cost-aware OFF/ON results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v4
        with:
          name: cost-aware-offvson-${{ inputs.run_tag }}
          path: ca_out/
          retention-days: 90
