name: Publish goldensuite-mcp to PyPI

# Fires on GitHub releases tagged `goldensuite-mcp-v*` (e.g.
# `goldensuite-mcp-v0.2.0`). Builds the aggregator MCP server package
# and uploads to PyPI. Mirrors the publish-goldenmatch.yml pattern.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag or commit to build (default: HEAD of main)"
        required: false
        default: ""

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'goldensuite-mcp-v')
    runs-on: ubuntu-latest
    environment: pypi
    defaults:
      run:
        working-directory: packages/python/goldensuite-mcp
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"

      - name: Verify version matches tag
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          TAG_VERSION="${TAG#goldensuite-mcp-v}"
          PKG_VERSION=$(python -c "import tomllib,sys; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match pyproject.toml ($PKG_VERSION)"
            exit 1
          fi
          echo "Version OK: $PKG_VERSION"

      - run: pip install build twine
      - run: python -m build
      # Validate with a CURRENT twine, not the one bundled inside the publish
      # action. Modern build backends emit `Metadata-Version: 2.5`; the
      # action's bundled twine carries a `packaging` old enough to reject it
      # outright --
      #   InvalidDistribution: '2.5' is not a valid metadata version
      # -- which is what failed goldenanalysis-v0.5.0 (run 32507401780). PyPI
      # itself accepts 2.5, and current twine passes the wheel, so the wheel is
      # fine and the stale validator is not. Same fix as _publish-pypi.yml;
      # this workflow is not a caller of that template (it carries its own
      # tag-vs-pyproject version check), so it needed the fix separately.
      - name: Validate distribution metadata
        run: python -m twine check dist/*
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          packages-dir: packages/python/goldensuite-mcp/dist
          password: ${{ secrets.PYPI_TOKEN }}
          skip-existing: true
          # Already checked above with a current twine. Left on, the
          # action re-runs the check with its stale copy and fails on 2.5.
          verify-metadata: false
