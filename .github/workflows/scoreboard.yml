name: North Star scoreboard

# NIGHTLY adaptation-metric snapshot -> context-network/planning/scoreboard.{jsonl,md}.
# The falsifiable North Star proxy (see context-network/planning/north-star-roadmap.md):
# stars, forks, PyPI/npm 30-day downloads, non-maintainer inbound issues -- tracked
# as a TREND with day-over-day deltas, not a rolling badge snapshot.
#
# Was weekly (Mondays 06:17 UTC); moved to nightly 2026-08-13 because the run is
# cheap (a handful of API calls, <10min budget, ubuntu-latest) and a daily series
# resolves adoption trends that a 52-point-a-year series cannot.
on:
  schedule:
    # 22:00 UTC = 18:00 US/Eastern while EDT is in effect. GitHub cron is fixed
    # UTC and does not follow DST, so this drifts to 17:00 Eastern over the
    # winter; shift to "0 23 * * *" if 18:00 local matters year-round.
    - cron: "0 22 * * *"
  workflow_dispatch: {}

permissions:
  contents: read  # the refreshed scoreboard lands via a bot PR, not a direct push

concurrency:
  group: scoreboard
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Snapshot the scoreboard
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/scoreboard.py
      - name: Upload the snapshot
        # BEFORE the landing step, and `if: always()`, so a week's numbers survive
        # even when landing fails (a missing/expired PAT, a GitHub outage). The
        # original failure mode here was doing all the work and then throwing it
        # away with a red run; the data should outlive the delivery mechanism.
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: scoreboard-snapshot
          path: |
            context-network/planning/scoreboard.jsonl
            context-network/planning/scoreboard.md
          if-no-files-found: ignore

      - name: Land the snapshot via a bot PR
        # `main` is protected (PR + merge queue + ci-required), so a direct push
        # is rejected with GH013 -- which is exactly how the first-ever run of
        # this workflow failed. See scripts/open_data_pr.sh for why this needs a
        # PAT rather than the default GITHUB_TOKEN.
        env:
          GM_BOT_TOKEN: ${{ secrets.GM_BOT_TOKEN }}
          PR_BODY: |
            Nightly North Star adoption snapshot: stars, forks, PyPI/npm 30-day
            downloads and non-maintainer inbound issues, appended to the trend.

            Generated by `scripts/scoreboard.py` via `.github/workflows/scoreboard.yml`.
            The `.md` is rewritten wholesale from the `.jsonl` each run; the new
            data is the single appended row.
        run: |
          bash scripts/open_data_pr.sh \
            bot/scoreboard \
            "chore(scoreboard): nightly adoption snapshot" \
            "chore(scoreboard): nightly adoption snapshot" \
            context-network/planning/scoreboard.jsonl \
            context-network/planning/scoreboard.md
