name: Publish golden-suite to PyPI

# Fires on GitHub releases tagged `golden-suite-v*` (e.g. `golden-suite-v0.1.0`).
# Builds the dependency-only meta-package and uploads to PyPI. Mirrors the
# publish-goldensuite-mcp.yml pattern. Tag prefix `golden-suite-v` is distinct
# from `goldensuite-mcp-v`, so the two do not collide.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag or commit to build (default: HEAD of main)"
        required: false
        default: ""

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'golden-suite-v')
    runs-on: ubuntu-latest
    environment: pypi
    defaults:
      run:
        working-directory: packages/python/golden-suite
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: Verify version matches tag
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          TAG_VERSION="${TAG#golden-suite-v}"
          PKG_VERSION=$(python -c "import tomllib,sys; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match pyproject.toml ($PKG_VERSION)"
            exit 1
          fi
          echo "Version OK: $PKG_VERSION"

      - run: pip install build twine
      - run: python -m build
      # Validate with a CURRENT twine, not the one bundled inside the publish
      # action. Modern build backends emit `Metadata-Version: 2.5`; the
      # action's bundled twine carries a `packaging` old enough to reject it
      # outright --
      #   InvalidDistribution: '2.5' is not a valid metadata version
      # -- which is what failed goldenanalysis-v0.5.0 (run 32507401780). PyPI
      # itself accepts 2.5, and current twine passes the wheel, so the wheel is
      # fine and the stale validator is not. Same fix as _publish-pypi.yml;
      # this workflow is not a caller of that template (it carries its own
      # tag-vs-pyproject version check), so it needed the fix separately.
      - name: Validate distribution metadata
        run: python -m twine check dist/*
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          packages-dir: packages/python/golden-suite/dist
          password: ${{ secrets.PYPI_TOKEN }}
          skip-existing: true
          # Already checked above with a current twine. Left on, the
          # action re-runs the check with its stale copy and fails on 2.5.
          verify-metadata: false
