name: spike-duckdb-identity-ingest

# Decides docs/design/2026-07-25-duckdb-identity-backend.md: can a STREAMING
# DuckDB ingest bound peak RSS below the stdlib staging path for the Identity
# Store bulk write?
#
# Three arms -- stdlib SQLite staging (the baseline), duckdb_inmem (register the
# in-memory Arrow table, confirms the frame is the floor), and duckdb_stream
# (generate the source to Parquet in bounded batches, then read_parquet scan +
# spill into a memory-limited DuckDB). Every arm's store is content-hashed, so a
# leaner arm that writes different bytes fails loudly.
#
# duckdb is already a project dependency (goldenmatch[duckdb]); no --with needed.
# Not part of PR gating -- workflow_dispatch only.
on:
  workflow_dispatch:
    inputs:
      ns:
        description: "Identity counts to sweep (comma-separated)"
        default: "100000,1000000,5000000"
      arms:
        description: "staging,duckdb_inmem,duckdb_stream"
        default: "staging,duckdb_inmem,duckdb_stream"

permissions:
  contents: read

jobs:
  spike:
    runs-on: large-new-64GB
    timeout-minutes: 120
    env:
      ARROW_DEFAULT_MEMORY_POOL: system
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39  # v3
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            **/pyproject.toml
      - run: uv sync --all-packages
      - name: Spike duckdb_stream vs duckdb_inmem vs staging
        run: |
          uv run python \
            packages/python/goldenmatch/scripts/spike_duckdb_identity_ingest.py \
            --ns "${{ inputs.ns }}" \
            --arms "${{ inputs.arms }}" \
            --output spike_duckdb_identity_ingest.json
      - name: Upload JSON artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v4
        with:
          name: spike-duckdb-identity-ingest-results
          path: spike_duckdb_identity_ingest.json
