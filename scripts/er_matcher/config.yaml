# Reproducible training config for the OSS ER-matcher (plan §Phase 3).
# Loaded + validated by scripts/er_matcher/train.py::load_config (unknown keys are
# rejected). Committed so a run is fully reproducible from (base + pinned revision,
# LoRA rank/alpha, LR, epochs, seq_len policy, packing, seed).
#
# The seq_len is MEASURED at train time (P95 of serialized-pair tokens, capped),
# not fixed here -- seq_len_percentile/cap/multiple_of are the policy.
#
# SP2 Task 8 right-sizing check: validated for the REAL multi-source corpus
# (build_corpus.py blend of febrl + Phase 1b synthetic + Magellan/Leipzig,
# ~25k rows total -> ~17,690 train pairs after gen_pairs.py), not the old
# ~2,844-row synthetic-only default this repo started with. At the real
# scale: eval_fraction 0.1 -> ~1,769 held-out eval pairs, which is a usable
# val slice for the P5 reliability curve (plenty of points, not so large it
# starves training). effective batch = per_device_batch(16) * grad_accum(2)
# = 32 -> ~498 steps/epoch, ~995 total steps over epochs: 2 -- reviewed and
# left as-is; none of epochs/per_device_batch/grad_accum needed changing for
# this corpus size. If a future corpus size changes these steps-per-epoch
# numbers enough to matter (e.g. a much smaller ad-hoc corpus), re-derive
# from scripts/er_matcher/_train_runtime.py::estimate_total_steps rather
# than eyeballing it here.

base_model: "Qwen/Qwen2.5-3B-Instruct"   # Apache-2.0, redistribution-clean
base_revision: null                       # pin to a base commit sha before the full run
serializer_version: "v1"                  # must match prompt.SERIALIZER_VERSION

# LoRA (bf16-LoRA preferred; QLoRA only if memory-bound)
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]

# optimization
learning_rate: 2.0e-4
epochs: 2.0
per_device_batch: 16
grad_accum: 2
warmup_ratio: 0.03
weight_decay: 0.0
lr_scheduler: "cosine"

# sequence handling (short-ER SFT: measured P95, packed)
seq_len_percentile: 95.0
seq_len_cap: 1024
seq_len_multiple_of: 64
packing: true
group_by_length: true

# precision
bf16: true
flash_attention_2: true
qlora_4bit: false

# SFT target confidences for the categorical synthetic labels (not saturated ->
# better calibration, which the P5 reliability curve checks)
match_confidence: 0.9
nomatch_confidence: 0.1

# data / reproducibility
eval_fraction: 0.1
seed: 20260726
dataloader_workers: 8
