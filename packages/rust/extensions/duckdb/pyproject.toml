[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "goldenmatch-duckdb"
version = "0.8.0"
description = "GoldenMatch entity resolution functions for DuckDB"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Ben Severn", email = "benzsevern@gmail.com" }]
keywords = ["entity-resolution", "duckdb", "deduplication", "record-matching"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "goldenmatch>=1.15.0",
    "duckdb>=1.0",
    "pyarrow>=14.0",
]

[project.optional-dependencies]
# goldenmatch_embed_local UDF runs the goldenembed-rs kernel via this wheel.
embed = ["goldenmatch-embed"]

[project.urls]
Homepage = "https://github.com/benseverndev-oss/goldenmatch"
Repository = "https://github.com/benseverndev-oss/goldenmatch"
Documentation = "https://docs.bensevern.dev/docs/extensions/sql"
# Agent-facing entry point. PyPI renders these URLs and they are scraped, so
# this is the discovery path for a tool that never clones the repo. The same
# file ships INSIDE the wheel at goldenmatch_duckdb/llms.txt, and is returned
# from inside a SQL session by `SELECT goldenmatch_docs();`.
"AI agents (llms.txt)" = "https://docs.bensevern.dev/docs/llms.txt"
Issues = "https://github.com/benseverndev-oss/goldenmatch/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
