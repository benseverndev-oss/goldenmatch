# Standalone workspace: a thin wasm-bindgen wrapper over `cluster-core`, so the
# JS/TS clustering step consumes the SAME MST-split + confidence kernels as the
# Python native path and the Rust core — one source of truth for
# "oversized-cluster splitting" and "cluster confidence". Mirrors the sibling
# `graph-wasm` crate (wasm-bindgen over graph-core).
[workspace]

[package]
name = "cluster-wasm"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Ben Severn <benzsevern@gmail.com>"]
description = "wasm-bindgen wrapper over cluster-core (MST-split + confidence) for the JS/TS port"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
goldenmatch-cluster-core = { path = "../cluster-core" }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
