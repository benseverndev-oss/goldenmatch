description: "Hospitality / travel — reservations, bookings, stays, rooms, guests"

types:
  reservation:
    name_hints: ["reservation_id", "reservation_number", "booking_id", "booking_reference"]
    value_signals:
      min_unique_pct: 0.90
    suppress: ["cardinality", "pattern_consistency", "drift_detection"]

  stay:
    name_hints: ["check_in", "check_out"]
    suppress: ["pattern_consistency"]

  room:
    name_hints: ["room_type", "room_number", "guest_name"]
    value_signals:
      max_unique: 100
    suppress: ["uniqueness"]

  billing:
    name_hints: ["nights", "occupancy", "rate_per_night", "confirmation_number"]
    suppress: ["pattern_consistency"]

# `guest` is declared to lift its suppression (it appears in the `room` type's
# name_hints) -- the central party of the vertical was undetectable.
roles:
  guest:
    kind: person
    name_hints: ["guest", "occupant", "traveler", "patron"]
    typical_types: ["reservation", "stay"]

  property:
    kind: place
    name_hints: ["hotel", "property", "resort", "lodge", "venue"]
    typical_types: ["room"]

  agency:
    kind: organization
    name_hints: ["agency", "ota", "channel"]

  staff:
    kind: person
    name_hints: ["concierge", "housekeeper"]
