description: "Energy / utilities — meters, consumption (kWh), tariffs, utility accounts"

types:
  meter:
    name_hints: ["meter_id", "meter_number", "meter_reading"]
    value_signals:
      min_unique_pct: 0.80
    suppress: ["cardinality", "pattern_consistency", "drift_detection"]

  consumption:
    name_hints: ["kwh", "kwh_consumed", "consumption_kwh", "usage_kwh"]
    value_signals:
      numeric: true
    suppress: ["pattern_consistency"]

  tariff:
    name_hints: ["tariff", "tariff_rate"]
    value_signals:
      max_unique: 20
    suppress: ["uniqueness", "range_distribution"]

  account:
    name_hints: ["utility_account", "billing_period", "peak_demand", "service_point"]
    suppress: ["pattern_consistency"]

# `utility` is declared to lift its suppression (it appears in the `account`
# type's name_hints).
roles:
  customer:
    kind: person
    name_hints: ["customer", "consumer", "ratepayer"]
    typical_types: ["account"]

  utility:
    kind: organization
    name_hints: ["utility", "supplier", "retailer", "distributor"]
    typical_types: ["tariff"]

  meter:
    kind: asset
    name_hints: ["meter", "register"]
    typical_types: ["meter", "consumption"]

  site:
    kind: place
    name_hints: ["site", "premise", "premises", "facility"]
