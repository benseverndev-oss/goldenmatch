description: "Real estate — listings, properties, features (beds/baths/sqft), sale prices"

types:
  listing:
    name_hints: ["listing_id", "listing_price", "mls", "mls_number"]
    value_signals:
      min_unique_pct: 0.80
    suppress: ["cardinality", "pattern_consistency"]

  property:
    name_hints: ["property_id", "property_type", "property_address"]
    suppress: ["pattern_consistency"]

  features:
    name_hints: ["bedrooms", "bathrooms", "square_feet", "sqft", "lot_size", "year_built", "garage"]
    value_signals:
      numeric: true
    suppress: ["pattern_consistency"]

  price:
    name_hints: ["asking_price", "list_price", "sale_price", "sold_price"]
    value_signals:
      numeric: true
    suppress: ["pattern_consistency"]

# No party token is suppressed here, so these roles are purely additive
# vocabulary -- the vertical simply had none declared.
roles:
  property:
    kind: place
    name_hints: ["property", "listing", "dwelling", "parcel"]
    typical_types: ["listing", "property", "features"]

  buyer:
    kind: person
    name_hints: ["buyer", "purchaser"]

  seller:
    kind: person
    name_hints: ["seller", "grantor"]

  agent:
    kind: person
    name_hints: ["agent", "realtor", "broker"]

  landlord:
    kind: person
    name_hints: ["landlord", "lessor"]

  tenant:
    kind: person
    name_hints: ["tenant", "lessee", "renter"]

  lender:
    kind: organization
    name_hints: ["lender", "mortgagee"]
