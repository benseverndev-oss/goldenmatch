description: "Insurance — policies, claims, premiums, coverage, underwriting, beneficiaries"

types:
  policy:
    name_hints: ["policy_number", "policy_id", "policy_no"]
    value_signals:
      min_unique_pct: 0.90
    suppress: ["cardinality", "pattern_consistency", "drift_detection"]

  claim:
    name_hints: ["claim_number", "claim_id", "claim_no", "claim_status"]
    suppress: ["pattern_consistency"]

  premium:
    name_hints: ["premium", "premium_amount", "annual_premium"]
    value_signals:
      numeric: true
    suppress: ["pattern_consistency"]

  deductible:
    name_hints: ["deductible"]
    value_signals:
      numeric: true
    suppress: ["pattern_consistency"]

  coverage:
    name_hints: ["coverage", "coverage_amount", "coverage_type", "sum_insured"]
    value_signals:
      max_unique: 30
    suppress: ["uniqueness", "range_distribution"]

  policyholder:
    name_hints: ["policyholder", "insured"]
    value_signals:
      mixed_case: true
    suppress: ["pattern_consistency"]

  underwriter:
    name_hints: ["underwriter"]
    value_signals:
      mixed_case: true
    suppress: ["pattern_consistency"]

  beneficiary:
    name_hints: ["beneficiary"]
    value_signals:
      mixed_case: true
    suppress: ["pattern_consistency"]

  insurance_type:
    name_hints: ["insurance_type", "policy_type"]
    value_signals:
      max_unique: 20
    suppress: ["uniqueness", "range_distribution"]

# Entity roles (schema v4) — see finance.yaml for the roles-vs-types contract.
roles:
  policyholder:
    kind: person
    name_hints: ["policyholder", "insured", "member", "subscriber"]
    typical_types: ["policy", "coverage", "premium"]

  beneficiary:
    kind: person
    name_hints: ["beneficiary", "dependent"]
    typical_types: ["policy"]

  claimant:
    kind: person
    name_hints: ["claimant"]
    typical_types: ["claim"]

  adjuster:
    kind: person
    name_hints: ["adjuster", "examiner"]
    typical_types: ["claim"]

  underwriter:
    kind: organization
    name_hints: ["underwriter", "carrier", "insurer"]
    typical_types: ["policy", "premium"]

  broker:
    kind: organization
    name_hints: ["broker", "agency", "producer"]
    typical_types: ["policy", "premium"]
