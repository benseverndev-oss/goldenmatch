[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "infermap"
version = "0.6.0"
description = "Inference-driven schema mapping engine"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Ben Severn", email = "ben@bensevern.dev" }]
keywords = ["schema", "mapping", "schema-mapping", "schema-matching", "etl", "data-engineering", "data-integration", "column-mapping", "field-mapping", "golden-suite"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "polars>=1.0",
    # Jaro-Winkler for the FuzzyNameScorer pure-Python fallback. goldenfuzz is our
    # owned string-metric kernel (replaces the former rapidfuzz runtime dep). The
    # native infermap-core kernel is the primary path; this backs the pure fallback.
    "goldenfuzz>=0.1.0",
    # numpy backs the calibrators + engine (previously pulled in transitively via
    # scipy). scipy itself is EVICTED: its sole runtime use was a 2-param
    # Nelder-Mead fit, now owned in `infermap._optimize` (byte-close to scipy;
    # scipy stays a dev-group parity oracle). Dropping it removes the compiled
    # BLAS/LAPACK/Fortran tree from `pip install infermap`.
    "numpy>=1.26",
    "pyyaml>=6.0",
    "typer>=0.12",
    "goldencheck-types",
]

[project.optional-dependencies]
postgres = ["psycopg2-binary>=2.9"]
mysql = ["mysql-connector-python>=8.0"]
duckdb = ["duckdb>=0.9"]
excel = ["openpyxl>=3.1"]
llm = ["openai>=1.30", "anthropic>=0.30"]
all = ["infermap[postgres,mysql,duckdb,excel,llm]"]
mcp = ["mcp>=1.28.1"]
# Optional Rust accelerator (infermap-core/infermap-native crates, Wave 1). The
# matching `[tool.uv.sources] infermap-native = { path = ... }` at the repo root wires
# the local build for uv sync. Kept OUT of `all` (compiled native stays out of
# aggregates, like goldenmatch[native]).
native = ["infermap-native>=0.1.0"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[project.scripts]
infermap = "infermap.cli:app"

[project.urls]
Homepage = "https://github.com/benseverndev-oss/goldenmatch"
Repository = "https://github.com/benseverndev-oss/goldenmatch"
Documentation = "https://docs.bensevern.dev/infermap"
# Agent-facing entry point. PyPI renders these URLs and they are scraped,
# so this is the discovery path for a tool that never clones the repo. The
# same file ships INSIDE the wheel at infermap/llms.txt.
"AI agents (llms.txt)" = "https://docs.bensevern.dev/llms.txt"
Issues = "https://github.com/benseverndev-oss/goldenmatch/issues"
Changelog = "https://github.com/benseverndev-oss/goldenmatch/blob/main/packages/python/infermap/CHANGELOG.md"
Author = "https://bensevern.dev"

[tool.pytest.ini_options]
testpaths = ["tests"]

