description: "Finance — account numbers, routing numbers, CUSIP/ISIN, currency codes, transactions"

types:
  account_number:
    name_hints: ["account_number", "acct_num", "account_id", "acct_id"]
    value_signals:
      min_unique_pct: 0.90
    suppress: ["cardinality", "pattern_consistency", "drift_detection"]

  routing_number:
    name_hints: ["routing", "aba", "swift", "bic"]
    value_signals:
      short_strings: true
    suppress: ["uniqueness", "pattern_consistency"]

  cusip:
    name_hints: ["cusip", "isin", "sedol", "ticker", "symbol"]
    value_signals:
      short_strings: true
    suppress: ["type_inference", "cardinality"]

  currency_code:
    name_hints: ["currency", "ccy", "currency_code"]
    value_signals:
      max_unique: 20
    suppress: ["uniqueness", "range_distribution"]

  transaction_type:
    name_hints: ["transaction_type", "txn_type", "tx_type", "payment_method"]
    value_signals:
      max_unique: 20
    suppress: ["uniqueness", "range_distribution"]

  merchant:
    name_hints: ["merchant", "vendor", "payee", "counterparty"]
    value_signals:
      mixed_case: true
    suppress: ["pattern_consistency"]

  transaction_amount:
    name_hints: ["transaction_amount", "txn_amount", "debit", "credit"]
    value_signals:
      numeric: true
    suppress: ["pattern_consistency"]

  reference_number:
    name_hints: ["reference", "ref_number", "confirmation", "trace"]
    value_signals:
      min_unique_pct: 0.95
    suppress: ["cardinality", "pattern_consistency", "drift_detection"]

# Entity roles (schema v4). A role names a PARTY a record refers to, as
# distinct from `types:` above, which name FIELD types. Consumed by
# infermap's identity-layer detector; `typical_types` corroborates a
# detected layer but never vetoes one.
roles:
  financial_institution:
    kind: organization
    name_hints: ["bank", "institution", "depository", "custodian"]
    typical_types: ["routing_number", "account_number"]

  lender:
    kind: organization
    name_hints: ["lender", "originator", "creditor", "issuer", "servicer"]
    typical_types: ["account_number", "routing_number"]

  borrower:
    kind: person
    name_hints: ["borrower", "debtor", "obligor", "applicant"]
    typical_types: ["account_number"]

  payor:
    kind: organization
    name_hints: ["payor", "payer", "remitter"]
    typical_types: ["account_number", "routing_number", "transaction_amount"]

  payee:
    kind: organization
    name_hints: ["payee", "beneficiary", "recipient"]
    typical_types: ["account_number", "routing_number"]

  merchant:
    kind: organization
    name_hints: ["merchant", "vendor", "counterparty", "acquirer"]
    typical_types: ["merchant", "transaction_amount"]
