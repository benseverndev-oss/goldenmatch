description: "Logistics / supply chain — shipments, tracking, carriers, freight, warehouses"

types:
  tracking:
    name_hints: ["tracking_number", "tracking_id", "shipment_id", "shipment_number"]
    value_signals:
      min_unique_pct: 0.90
    suppress: ["cardinality", "pattern_consistency", "drift_detection"]

  document:
    name_hints: ["waybill", "awb", "bill_of_lading"]
    suppress: ["pattern_consistency"]

  container:
    name_hints: ["container_number", "consignment", "consignee"]
    suppress: ["pattern_consistency"]

  freight:
    name_hints: ["carrier", "freight", "warehouse_id"]
    value_signals:
      max_unique: 50
    suppress: ["uniqueness", "range_distribution"]

  status:
    name_hints: ["delivery_status", "dispatch_date"]
    value_signals:
      max_unique: 20
    suppress: ["uniqueness", "range_distribution"]

# `consignee` (via the `container` type) and `carrier` / `warehouse` (via
# `freight`) were all suppressed -- a waybill's two core parties, shipper and
# consignee, could not both be detected.
roles:
  shipper:
    kind: organization
    name_hints: ["shipper", "consignor", "sender"]

  consignee:
    kind: organization
    name_hints: ["consignee", "receiver"]

  carrier:
    kind: organization
    name_hints: ["carrier", "hauler", "forwarder", "courier"]
    typical_types: ["tracking", "freight"]

  warehouse:
    kind: place
    name_hints: ["warehouse", "depot", "terminal", "hub"]

  container:
    kind: asset
    name_hints: ["container", "trailer", "pallet"]
    typical_types: ["container"]
