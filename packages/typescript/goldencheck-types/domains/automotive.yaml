description: "Automotive — vehicles, VIN/plate/registration, odometer, make/model"

types:
  identifier:
    name_hints: ["vin", "license_plate", "registration_number"]
    value_signals:
      min_unique_pct: 0.90
    suppress: ["cardinality", "pattern_consistency", "drift_detection"]

  odometer:
    name_hints: ["odometer", "mileage"]
    value_signals:
      numeric: true
    suppress: ["pattern_consistency"]

  engine:
    name_hints: ["engine_number", "chassis_number"]
    value_signals:
      min_unique_pct: 0.80
    suppress: ["cardinality", "pattern_consistency"]

  vehicle:
    name_hints: ["make", "model", "trim", "fuel_type"]
    value_signals:
      max_unique: 100
    suppress: ["uniqueness"]

# Parties an automotive dataset refers to. `vehicle` is deliberately declared:
# it is a field TYPE here, and a role declaration is what lets `vehicle_*`
# columns group as the asset population they describe.
roles:
  vehicle:
    kind: asset
    name_hints: ["vehicle", "car", "auto", "unit"]
    typical_types: ["vehicle", "identifier", "odometer", "engine"]

  owner:
    kind: person
    name_hints: ["owner", "registrant", "lessee"]

  driver:
    kind: person
    name_hints: ["driver", "operator"]

  dealer:
    kind: organization
    name_hints: ["dealer", "dealership"]

  manufacturer:
    kind: organization
    name_hints: ["manufacturer", "oem", "make"]
